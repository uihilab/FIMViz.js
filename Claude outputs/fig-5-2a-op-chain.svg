<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>FIMViz.js — the Case Study 8 op chain, from one NetCDF4 file to basin means</title>
  <desc>One DWR scenario file enters through addDataset, once per variable, and becomes three Datasets
        sharing a 59-step CF time axis. A held select node per variable and day feeds the phase rule:
        a mean combine gives the daily mean temperature, a reclassify turns it into an open mask, a min
        combine keeps the rain, and a difference gives the snow. A sum combine totals the 59 days.
        Nothing computes until mask and Stats.raster force the chain.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1180" height="600" fill="#ffffff"/>

  <!-- deferred band -->
  <rect x="292" y="66" width="644" height="404" rx="12" fill="#f8fafc" stroke="#94a3b8"
        stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="312" y="90" font-size="12.5" font-weight="700" fill="#334155">composed, not computed
    <tspan font-weight="400" fill="#64748b">— each call returns a Dataset carrying an op descriptor</tspan></text>

  <!-- A: the file -->
  <rect x="36" y="188" width="176" height="96" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="124" y="214" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-weight="700" fill="#0f172a" text-anchor="middle">oroville-2017-sNN.nc</text>
  <text x="124" y="234" font-size="10.5" fill="#64748b" text-anchor="middle">CF NetCDF4 · 523 kB</text>
  <text x="124" y="250" font-size="10.5" fill="#64748b" text-anchor="middle">59 days × 24 × 31 · 1/16°</text>
  <text x="124" y="270" font-size="10.5" fill="#64748b" text-anchor="middle">pr, tmin, tmax · 6 scenarios</text>

  <path d="M212,236 H290" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>
  <text x="249" y="186" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace"
        fill="#334155" text-anchor="middle">addDataset(</text>
  <text x="249" y="201" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace"
        fill="#334155" text-anchor="middle">file,</text>
  <text x="249" y="216" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace"
        fill="#334155" text-anchor="middle">{ variable })</text>
  <text x="249" y="262" font-size="10" fill="#64748b" text-anchor="middle">once per</text>
  <text x="249" y="276" font-size="10" fill="#64748b" text-anchor="middle">variable</text>

  <!-- B: three Datasets -->
  <rect x="308" y="112" width="164" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="390" y="136" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">pr</text>
  <text x="390" y="154" font-size="10" fill="#1e40af" text-anchor="middle">millimeters</text>

  <rect x="308" y="184" width="164" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="390" y="208" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">tmin</text>
  <text x="390" y="226" font-size="10" fill="#1e40af" text-anchor="middle">degrees Celsius</text>

  <rect x="308" y="256" width="164" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="390" y="280" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">tmax</text>
  <text x="390" y="298" font-size="10" fill="#1e40af" text-anchor="middle">degrees Celsius</text>

  <text x="390" y="336" font-size="10.5" fill="#475569" text-anchor="middle">three Datasets, one 59-step CF time axis</text>

  <!-- B -> C -->
  <path d="M472,141 H506 V213" fill="none" stroke="#475569" stroke-width="1.7"/>
  <path d="M472,213 H506" fill="none" stroke="#475569" stroke-width="1.7"/>
  <path d="M472,285 H506 V213" fill="none" stroke="#475569" stroke-width="1.7"/>
  <path d="M506,213 H544" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>

  <!-- C: select -->
  <rect x="546" y="160" width="156" height="106" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="624" y="184" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-weight="700" fill="#0f172a" text-anchor="middle">select(coord)</text>
  <text x="624" y="204" font-size="10.5" fill="#64748b" text-anchor="middle">one day, per variable</text>
  <text x="624" y="224" font-size="10.5" fill="#64748b" text-anchor="middle">177 nodes held per</text>
  <text x="624" y="240" font-size="10.5" fill="#64748b" text-anchor="middle">scenario, so a repeat</text>
  <text x="624" y="256" font-size="10.5" fill="#64748b" text-anchor="middle">chain reuses the grid</text>

  <path d="M702,213 H736" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>

  <!-- D: the phase rule -->
  <rect x="738" y="104" width="192" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="754" y="124" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">tavg = tmin.combine(</text>
  <text x="754" y="140" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  [tmax], { op: "mean" })</text>

  <rect x="738" y="166" width="192" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="754" y="186" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">mask = tavg.reclassify(</text>
  <text x="754" y="202" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  v =&gt; v &gt; 0 °C)</text>

  <rect x="738" y="228" width="192" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="754" y="248" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">rain = pr.combine(</text>
  <text x="754" y="264" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  [mask], { op: "min" })</text>

  <rect x="738" y="290" width="192" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="754" y="310" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">snow = pr.difference(</text>
  <text x="754" y="326" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  rain)</text>

  <path d="M834,150 V166" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M834,212 V228" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M834,274 V290" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="738" y="358" width="192" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="754" y="378" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">combine(days,</text>
  <text x="754" y="394" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  { op: "sum" })</text>
  <text x="820" y="424" font-size="10" fill="#475569" text-anchor="middle">59 days to one window total, per phase</text>

  <path d="M834,336 V358" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- force boundary -->
  <line x1="954" y1="66" x2="954" y2="470" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="954" y="56" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">force</text>

  <path d="M930,381 H986" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#o)"/>

  <!-- E: terminals -->
  <rect x="988" y="290" width="152" height="60" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="1064" y="314" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-weight="700" fill="#7c2d12" text-anchor="middle">mask(basinRing)</text>
  <text x="1064" y="334" font-size="10" fill="#9a3412" text-anchor="middle">NLDI, gage 11407000</text>

  <rect x="988" y="368" width="152" height="74" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="1064" y="392" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-weight="700" fill="#7c2d12" text-anchor="middle">Stats.raster</text>
  <text x="1064" y="411" font-size="10" fill="#9a3412" text-anchor="middle">270 basin cells</text>
  <text x="1064" y="427" font-size="10" fill="#9a3412" text-anchor="middle">basin mean, mm</text>

  <path d="M1064,350 V368" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#o)"/>

  <text x="1064" y="268" font-size="10.5" fill="#7c2d12" text-anchor="middle">the whole chain runs</text>
  <text x="1064" y="252" font-size="10.5" fill="#7c2d12" text-anchor="middle">once, here</text>

  <!-- measured strip -->
  <rect x="40" y="498" width="1100" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="60" y="522" font-size="11.5" font-weight="700" fill="#334155">measured
    <tspan font-weight="400" fill="#64748b">— Chrome 153, Windows 10, warm cache, one repetition</tspan></text>
  <text x="60" y="546" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#334155">t_fetch 3.1–6.7 ms</text>
  <text x="248" y="546" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#334155">t_decode 191.6 ms first, then 3.0–11.4 ms</text>
  <text x="600" y="546" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#334155">t_op select 0.2 ms · mean 0.9 ms</text>
  <text x="890" y="546" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#334155">t_op window 14.6–20.7 ms</text>
  <text x="60" y="562" font-size="10" fill="#64748b">Decoding all 177 day-slices of one scenario up front costs 643–752 ms; the chain above needs only the days in the window.</text>
</svg>
