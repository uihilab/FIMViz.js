<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FIMViz — method playground (every module, every method, with parameters)</title>
<!-- Leaflet stylesheet (only asset; needed for the real keyless map). -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 system-ui, sans-serif; background: #0f1216; color: #e6edf3; }
  header { padding: 10px 16px; border-bottom: 1px solid #2b3440; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 15px; }
  code { font-family: ui-monospace, Menlo, monospace; color: #9ecbff; }
  a { color: #58a6ff; }
  .switch a { font-size: 12px; padding: 2px 8px; border: 1px solid #2b3440; border-radius: 999px; text-decoration: none; }
  .switch a.on { background: #58a6ff; color: #08111f; font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 460px; gap: 0; height: calc(100vh - 44px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
  #results { overflow: auto; padding: 8px 14px; }
  #map { min-height: 420px; border-left: 1px solid #2b3440; background: #1b2230; }
  h2 { font-size: 13px; margin: 16px 0 4px; color: #e6edf3; border-bottom: 1px solid #2b3440; padding-bottom: 3px; }
  .r { display: grid; grid-template-columns: 300px 1fr; gap: 8px; padding: 1px 0; align-items: start; }
  .r .n { color: #c9d1d9; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .r .v { color: #8b949e; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .r .v.err { color: #d29922; }
  .note { position: sticky; top: 0; background: #0f1216; padding: 6px 0; z-index: 2; font-size: 12px; color: #8b949e; }
  .hosts { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .host { min-width: 180px; }
  button { background: #21262d; color: #e6edf3; border: 1px solid #2b3440; border-radius: 5px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>FIMViz — method playground</h1>
  <span class="switch" id="switch"></span>
  <span id="prov-note" style="color:#8b949e;font-size:12px"></span>
</header>

<main>
  <div id="results">
    <div class="note" id="note">Every public method is called once with sample parameters below. Open the console — all live objects are on <code>window.FIM</code>. Edit any call and reload, or re-run pieces from the console.</div>
    <div class="hosts">
      <div class="host" id="host-tools"></div>
      <div class="host" id="host-tools2"></div>
      <div class="host" id="host-ops"></div>
    </div>
    <div class="row">
      <button id="btn-download-ds">Dataset.download()</button>
      <button id="btn-download-stats">Stats.download('name.csv')</button>
      <button id="btn-destroy">fim.destroy()</button>
    </div>
    <div id="log"></div>
  </div>
  <div id="map"></div>
</main>

<script type="importmap">
{ "imports": { "fimviz": "../dist/fimviz.js", "fimviz/ui": "../dist/ui.js" } }
</script>

<script type="module">
import {
  // boot / lifecycle
  FimViz, mount,
  // map provider seam
  createMap,
  // dataset + warp + storage
  Dataset, warp, Storage,
  // materialize seam
  RasterGrid, VectorFeatures,
  registerBuiltinMaterializers, registerGdalReprojector,
  // read-models
  ColorScale,
  Legend, Stats, Filter, SpatialFilter, PredicateFilter,
  // layer model
  Layer, RasterLayer, VectorLayer,
  ComparisonLayer, EnsembleAggregationLayer,
  // raster pipeline + ops
  colorizeGrid, gridToDataURL,
  maskGrid, clipGrid, reclassifyGrid, combineGrids, zonalStats,
  // registry queries
  // vendored primitives
  fromArrayBuffer, kml, shp, Loader,
} from "fimviz";

// The headless UI module lives at its OWN subpath and is not re-exported by the barrel — one home,
// so an app can never end up with two copies of it. It pulls only small pure deps (~17 KB).
import {
  createToast, connectToast, createTooltip, bindHoverValue,
  createInfoWindow, propsTable, bindFeatureInfo,
  createToolsPanel, rasterControls, vectorControls, renderLegend, renderStats,
  createRegionDraw, createOperationsPanel,
} from "fimviz/ui";

// ─────────────────────────────────────────────────────────────────────────────
// tiny runner — runs a call, prints its label + returned value (or ERR). No
// assertions: this is a scratch bench, so YOU can eyeball / tweak every result.
// ─────────────────────────────────────────────────────────────────────────────
const logEl = document.getElementById("log");
function section(title) { const h = document.createElement("h2"); h.textContent = title; logEl.appendChild(h); }
function short(v) {
  try {
    if (v === undefined) return "undefined";
    if (v === null) return "null";
    if (typeof v === "string") return v.length > 100 ? v.slice(0, 100) + "…" : v;
    if (typeof v === "function") return `ƒ ${v.name || "anon"}`;
    if (Array.isArray(v)) return `[${v.length}] ` + JSON.stringify(v).slice(0, 90);
    if (typeof v === "object") return (v.constructor?.name || "obj") + " " + JSON.stringify(v).slice(0, 90);
    return String(v);
  } catch { return typeof v; }
}
function print(label, value, isErr) {
  const r = document.createElement("div"); r.className = "r";
  r.innerHTML = `<span class="n">${label}</span><span class="v ${isErr ? "err" : ""}">${short(value)}</span>`;
  logEl.appendChild(r);
}
// run a synchronous call; show what it returns
function run(label, fn) { try { const v = fn(); print(label, v); return v; } catch (e) { print(label, "ERR: " + e.message, true); } }
// run an async call
async function runA(label, fn) { try { const v = await fn(); print(label, v); return v; } catch (e) { print(label, "ERR: " + e.message, true); } }

// ─────────────────────────────────────────────────────────────────────────────
// synthetic data (no uploads): a 24×24 gradient raster + inline geojson
// ─────────────────────────────────────────────────────────────────────────────
const CENTER = { lat: 41.9779, lng: -91.6656 }, ZOOM = 12;
const B = { west: -91.71, east: -91.62, south: 41.95, north: 42.01 };
const BOUNDS = { north: B.north, south: B.south, east: B.east, west: B.west };
const W = 24, H = 24, ND = -99999;
function makePixels(scale = 1, offset = 0) {
  const px = new Float64Array(W * H);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) px[r * W + c] = (r + c) * scale + offset;
  px[0] = ND; px[W * H - 1] = ND;   // a couple of noData cells
  return px;
}
const META = { bw: B.west, bs: B.south, be: B.east, bn: B.north, width: W, height: H, noData: ND, unit: "m" };
const newGrid = (scale = 1, offset = 0, noData = ND) =>
  new RasterGrid({ pixels: makePixels(scale, offset), width: W, height: H, bounds: BOUNDS, noData, meta: { unit: "m" } });
const extentA = { pixels: makePixels(1), meta: { ...META } };
const extentB = { pixels: makePixels(1, 5), meta: { ...META } };
const extentC = { pixels: makePixels(2), meta: { ...META } };
const leftHalf = [   // a polygon ring (left half of the footprint)
  { lat: B.south, lng: B.west }, { lat: B.north, lng: B.west },
  { lat: B.north, lng: (B.west + B.east) / 2 }, { lat: B.south, lng: (B.west + B.east) / 2 },
];
const GEOJSON = {
  type: "FeatureCollection",
  features: [
    { type: "Feature", properties: { name: "poly-1", cat: "wet" }, geometry: { type: "Polygon",
      coordinates: [[[B.west + 0.01, B.south + 0.01], [B.west + 0.03, B.south + 0.01],
        [B.west + 0.03, B.south + 0.03], [B.west + 0.01, B.south + 0.03], [B.west + 0.01, B.south + 0.01]]] } },
    { type: "Feature", properties: { name: "pt-1", cat: "dry" }, geometry: { type: "Point",
      coordinates: [CENTER.lng, CENTER.lat] } },
  ],
};

// register decoders for our synthetic formats so a Dataset can force()
Dataset.registerMaterializer("demo", async () => newGrid(1, 0));    // Dataset.registerMaterializer(format, async (root, ds) => RasterGrid|VectorFeatures)
Dataset.registerMaterializer("demo2", async () => newGrid(1, 5));

// live handles exposed for the console
const FIM = window.FIM = { data: { newGrid, makePixels, META, BOUNDS, leftHalf, GEOJSON, extentA, extentB, extentC } };

// ═════════════════════════════════════════════════════════════════════════════
// PART A — pure / headless modules (no map needed)
// ═════════════════════════════════════════════════════════════════════════════

// ── colorScale.js: palettes ──────────────────────────────────────────────────
// The palette registry is ColorScale's, so it lives on the class: palettes() lists every available
// name, which also answers "do I have X" via .includes() — no separate hasPalette needed.
section("palettes — ColorScale.palettes / ColorScale.registerPalette");
run("ColorScale.palettes()", () => ColorScale.palettes());
run("palettes().includes('viridis')", () => ColorScale.palettes().includes("viridis"));
run("palettes().includes('nope')", () => ColorScale.palettes().includes("nope"));
run("ColorScale.registerPalette('demo-pal', ['#000','#f00','#fff'])", () => ColorScale.registerPalette("demo-pal", ["#000000", "#ff0000", "#ffffff"]));  // ColorScale.registerPalette(name, colors[])
run("palettes().includes('demo-pal')", () => ColorScale.palettes().includes("demo-pal"));

// ── colorScale.js: ColorScale ────────────────────────────────────────────────
section("ColorScale — constructor params, statics, read, write, notify");
// new ColorScale({ palette, min, max, continuous, stops, unit, source })
const cs = FIM.cs = run("new ColorScale({palette,min,max,continuous,unit})", () => new ColorScale({ palette: "viridis", min: 0, max: 46, continuous: true, unit: "m", source: null }));
run("new ColorScale({stops:[{value,color,label}]})", () => new ColorScale({ stops: [{ value: 1, color: "#f00", label: "one" }] }));
run("new ColorScale({palette:['#000','#fff']})", () => new ColorScale({ palette: ["#000", "#fff"] }));       // custom color array
run("ColorScale.fromGdalLegend(legend, unit)", () => ColorScale.fromGdalLegend([{ range: [0, 5], color: "#00f", label: "0–5" }, { range: [5, 46], color: "#f00", label: "5+" }], "m"));
run("cs.kind", () => cs.kind);
run("cs.isExplicit", () => cs.isExplicit);
run("cs.discrete", () => cs.discrete);
run("cs.getStops()", () => cs.getStops());
run("cs.getValues()", () => cs.getValues());
run("cs.getRange(0)", () => cs.getRange(0));                                   // getRange(bandIndex)
run("cs.getColor(20)", () => cs.getColor(20));                                 // getColor(value) → css string|null
run("cs.getRgb(20)", () => cs.getRgb(20));                                     // getRgb(value) → [r,g,b]|null
const onCs = () => { FIM.csFired = (FIM.csFired || 0) + 1; };
run("cs.onChange(fn)", () => cs.onChange(onCs));                               // onChange(fn) — fires on every write below
run("cs.set({ palette: 'heat' })", () => cs.set({ palette: "heat" }));                     // setPalette(nameOrColors)
run("cs.set({ min: 0, max: 46 })", () => cs.set({ min: 0, max: 46 }));                         // setDomain(min, max)
run("cs.set({ continuous: false })", () => cs.set({ continuous: false }));                       // continuous(bool)
run("cs.setStops([{min,max,color},…])", () => cs.setStops([{ min: 0, max: 20, color: "#00f" }, { min: 20, max: 46, color: "#f00" }]));  // setStops(stops)
run("cs.setRange(0, {min:0,max:10})", () => cs.setRange(0, { min: 0, max: 10 }));   // setRange(bandIndex, {min?,max?})
run("cs.setColor(0, '#00ff00')", () => cs.setColor(0, "#00ff00"));            // setColor(bandIndex, color)
run("cs.setLabel(0, 'low')", () => cs.setLabel(0, "low"));                    // setLabel(bandIndex, label)
run("cs.onChange fire count", () => FIM.csFired);
run("cs.offChange(fn)", () => cs.offChange(onCs));                            // offChange(fn)

// ── legend.js ────────────────────────────────────────────────────────────────
section("Legend — constructor, fromColorScale, toHtml, toJSON, format hooks");
// new Legend({ unit, kind:'classed'|'continuous', source:'gdal'|'palette'|'default'|'custom', stops })
const legend = FIM.legend = run("new Legend({unit,kind,source,stops})", () => new Legend({ unit: "m", kind: "classed", source: "custom", stops: [{ min: 0, max: 10, color: "#00f", label: "0–10" }] }));
run("Legend.fromColorScale(cs, {source})", () => Legend.fromColorScale(cs, { source: "custom" }));
run("legend.toHtml()", () => legend.toHtml());
run("legend.toJSON()", () => legend.toJSON());
run("legend.formatValue = (v)=>…", () => { legend.formatValue = (v) => `${v} m`; return legend.toHtml(); });   // host hook: value → string
run("legend.formatLabel = (stop)=>…", () => { legend.formatLabel = (s) => s.label || s.color; return legend.toHtml(); }); // host hook: whole row label

// ── stats.js ─────────────────────────────────────────────────────────────────
section("Stats — raster + vector, percentile, diff, describe, toJSON, toCSV, download");
// Stats.raster(pixelData, meta, { filter, classify, skipZero, bins }) — filter=Filter|fn|array-of-filters; wrap a POLYGON in SpatialFilter
const statsR = FIM.statsR = run("Stats.raster(px, meta, {filter,classify,skipZero,bins})",
  () => Stats.raster(makePixels(1), META, { filter: new SpatialFilter(leftHalf), classify: cs, skipZero: true, bins: 32 }));
const statsR2 = run("Stats.raster(px, meta) — no opts (full grid)", () => Stats.raster(makePixels(2), META));
run("statsR.percentile(90)", () => statsR.percentile(90));                    // percentile(p 0–100)
run("statsR.diff(other)", () => statsR.diff(statsR2));                        // diff(otherStats) → {delta*}
run("statsR.describe()", () => statsR.describe());
run("statsR.toJSON()", () => statsR.toJSON());
run("statsR.toCSV()", () => statsR.toCSV());
// Stats.vector needs a google.maps.Data-shaped layer (has .forEach); a minimal stub:
const latlng = (lat, lng) => ({ lat: () => lat, lng: () => lng });
const ring = (pts) => ({ getArray: () => pts.map((p) => latlng(p[0], p[1])), getAt: (i) => latlng(pts[i][0], pts[i][1]) });
const stubData = { forEach(cb) {
  cb({ getGeometry: () => ({ getType: () => "Point", get: () => latlng(CENTER.lat, CENTER.lng) }) });
  cb({ getGeometry: () => ({ getType: () => "Polygon",
    getArray: () => [ring([[41.95, -91.70], [41.96, -91.70], [41.96, -91.69], [41.95, -91.70]])],
    getAt: () => ring([[41.95, -91.70], [41.96, -91.70], [41.96, -91.69], [41.95, -91.70]]) }) });
} };
const statsV = run("Stats.vector(dataLayer, {filter})", () => Stats.vector(stubData, { filter: null }));  // dataLayer = google.maps.Data-shaped
run("statsV.describe()", () => statsV.describe());
run("statsV.toCSV()", () => statsV.toCSV());
// statsR.download('stats.csv') — behind a button (writes a file); see the buttons above.

// ── filter.js ────────────────────────────────────────────────────────────────
section("Filter / SpatialFilter / PredicateFilter — from, all, test, contains, pixelBbox");
const sf = FIM.sf = run("new SpatialFilter(ring)", () => new SpatialFilter(leftHalf));   // [{lat,lng}|[lat,lng]…] or [[ring],[ring]…]
run("sf.features", () => sf.features);
run("sf.contains(41.98, west+0.01)", () => sf.contains(41.98, B.west + 0.01));           // contains(lat, lng)
run("sf.contains(41.98, east-0.01)", () => sf.contains(41.98, B.east - 0.01));
run("sf.test({lat,lng})", () => sf.test({ lat: 41.98, lng: B.west + 0.01 }));            // test(unit)
run("sf.isEmpty()", () => sf.isEmpty());
run("sf.pixelBbox(meta)", () => sf.pixelBbox(META));                                     // pixelBbox({bw,bs,be,bn,width,height})
const pf = run("new PredicateFilter(fn)", () => new PredicateFilter((val, x, y, at) => val > 10));  // fn(value,x,y,at) | fn(feature)
run("pf.test({value:20}) — raster unit", () => pf.test({ value: 20 }));
run("pf.test({feature}) — vector unit", () => new PredicateFilter((f) => f.properties.cat === "wet").test({ feature: GEOJSON.features[0] }));
run("Filter.from(SpatialFilter)", () => Filter.from(sf));
run("Filter.from(function)", () => Filter.from((v) => v > 0));
run("Filter.from(polygonArray)", () => Filter.from(leftHalf));                           // array → SpatialFilter
run("Filter.from({toFilter})", () => Filter.from({ toFilter: () => sf }));
run("Filter.all([sf, fn])", () => Filter.all([sf, (v) => v > 0]));                       // conjunction (AND)
run("new Filter().test({}) / .isEmpty()", () => [new Filter().test({}), new Filter().isEmpty()]);

// ── materialize.js: value types + seams ──────────────────────────────────────
section("materialize — RasterGrid, VectorFeatures, register* seams");
// new RasterGrid({ pixels, width, height, bounds, crs, noData, bands, meta })
run("new RasterGrid({pixels,width,height,bounds,crs,noData,bands,meta})",
  () => new RasterGrid({ pixels: makePixels(1), width: W, height: H, bounds: BOUNDS, crs: "EPSG:4326", noData: ND, bands: 1, meta: { unit: "m" } }));
// new VectorFeatures({ features, bounds, crs, meta })
run("new VectorFeatures({features,bounds,crs,meta})", () => new VectorFeatures({ features: GEOJSON, bounds: BOUNDS, crs: "EPSG:4326", meta: {} }));
run("Dataset.registerMaterializer('demo3', fn)", () => Dataset.registerMaterializer("demo3", async () => newGrid(3)));       // Dataset.registerMaterializer(format, async(root,ds)=>value)
run("registerBuiltinMaterializers()", () => registerBuiltinMaterializers());                                 // geotiff + geojson/kml/kmz/shp/hazus decoders
run("Dataset.registerReprojector(fn) — stub warp (no GDAL)", () => Dataset.registerReprojector(async (grid, crs) => new RasterGrid({ ...grid, crs })));  // Dataset.registerReprojector(async(grid,targetCrs)=>RasterGrid)
// The GDAL reprojector already auto-registered when "fimviz" was imported above; this stub call
// (which runs later, at click-time) overwrites it for this demo — registerGdalReprojector() would
// swap the real GDAL warp back in.
run("typeof registerGdalReprojector", () => typeof registerGdalReprojector);

// ── rasterOps.js ─────────────────────────────────────────────────────────────
section("rasterOps — maskGrid, clipGrid, reclassifyGrid, combineGrids, zonalStats");
run("maskGrid(grid, polygon, {invert:false})", () => maskGrid(newGrid(1), leftHalf, { invert: false }));      // maskGrid(grid, SpatialFilter|ring, {invert})
run("maskGrid(grid, polygon, {invert:true})", () => maskGrid(newGrid(1), leftHalf, { invert: true }));
run("clipGrid(grid, bbox)", () => clipGrid(newGrid(1), { north: B.north, south: B.south, east: (B.west + B.east) / 2, west: B.west }));  // clipGrid(grid, {north,south,east,west})
run("reclassifyGrid(grid, rules, {unmatched:'nodata'})", () => reclassifyGrid(newGrid(1), [{ min: 10, max: 30, value: 1 }], { unmatched: "nodata" }));  // rules=[{min?,max?,value?}]
run("reclassifyGrid(grid, rules, {unmatched:'keep'})", () => reclassifyGrid(newGrid(1), [{ min: 10, max: 30 }], { unmatched: "keep" }));
run("combineGrids([a,b], {op:'difference'})", () => combineGrids([newGrid(2), newGrid(1)], { op: "difference" }));   // op: difference|ratio|sum|mean|min|max, method: gdalwarp -r name
run("combineGrids([a,b], {op:'ratio'})", () => combineGrids([newGrid(2), newGrid(1, 1)], { op: "ratio" }));
run("combineGrids([a,b], {op:'sum'})", () => combineGrids([newGrid(1), newGrid(1)], { op: "sum" }));
run("combineGrids([a,b], {op:'mean'})", () => combineGrids([newGrid(1), newGrid(3)], { op: "mean" }));
run("combineGrids([a,b], {op:'min'})", () => combineGrids([newGrid(1), newGrid(3)], { op: "min" }));
run("combineGrids([a,b], {op:'max', method:'bilinear'})", () => combineGrids([newGrid(1), newGrid(3)], { op: "max", method: "bilinear" }));
run("zonalStats(grid, zones, {noData})", () => zonalStats(newGrid(1), [{ id: "left", polygon: leftHalf }, { id: "pt", filter: sf }], { noData: ND }));  // zones=[{id?,polygon?|filter?}]

// ── rasterImage.js ───────────────────────────────────────────────────────────
section("rasterImage — colorizeGrid, gridToDataURL");
run("colorizeGrid(grid, {colorScale,alpha,skipZero,noData})", () => colorizeGrid(newGrid(1), { colorScale: cs, alpha: 200, skipZero: true, noData: ND }));  // → Uint8ClampedArray RGBA
run("colorizeGrid(grid) — default viridis ramp", () => colorizeGrid(newGrid(1)));
run("gridToDataURL(grid, {colorScale})", () => gridToDataURL(newGrid(1), { colorScale: cs }));   // → PNG data URL

// ── dataset.js ───────────────────────────────────────────────────────────────
section("Dataset — constructor params, ops, terminals, persistence, axes");
// new Dataset({ id, name, kind, format, crs, bounds, meta, data, url, axis, axes })
const dsRoot = FIM.dsRoot = run("new Dataset({id,name,kind,format,crs,bounds,meta,data})",
  () => new Dataset({ id: "d1", name: "demo.tif", kind: "raster", format: "demo", crs: "EPSG:4326", bounds: BOUNDS, meta: { unit: "m" }, data: {} }));
const dsRoot2 = new Dataset({ name: "demo2.tif", kind: "raster", format: "demo2", crs: "EPSG:4326", bounds: BOUNDS, data: {} });
run("Dataset.fromURL(url, {name,format,crs,bounds,meta})", () => Dataset.fromURL("https://ex.com/x.tif", { name: "x.tif", crs: "EPSG:4326" }));
run("ds.isMaterialized (pre-force)", () => dsRoot.isMaterialized);
run("ds.warnings", () => dsRoot.warnings);
run("ds.mask(polygon, {invert})", () => dsRoot.mask(leftHalf, { invert: false }));         // → new lazy Dataset
run("ds.clip(bbox)", () => dsRoot.clip({ north: B.north, south: B.south, east: (B.west + B.east) / 2, west: B.west }));
run("ds.reclassify(rules, {unmatched})", () => dsRoot.reclassify([{ min: 5, max: 30, value: 1 }], { unmatched: "nodata" }));
run("ds.combine([other], {op,method})", () => dsRoot.combine([dsRoot2], { op: "sum", method: "nearest" }));
run("ds.difference(other)", () => dsRoot.difference(dsRoot2));
run("ds.reproject('EPSG:3857') — new lazy node", () => dsRoot.reproject("EPSG:3857"));      // warp(toCrs)
run("ds.reproject('EPSG:4326') — same-CRS no-op → this", () => dsRoot.reproject("EPSG:4326") === dsRoot);
await runA("await ds.load()", () => dsRoot.load());                                          // force → RasterGrid|VectorFeatures
await runA("await ds.grid()", () => dsRoot.grid());                                          // force + assert raster
await runA("await ds.mask(polygon).grid() — forces the chain", () => dsRoot.mask(leftHalf).grid());
await runA("await ds.reproject('EPSG:3857').grid() — via stub reprojector", () => dsRoot.reproject("EPSG:3857").grid());
await runA("await ds.difference(other).grid()", () => dsRoot.difference(dsRoot2).grid());
await runA("await ds.zonalStats(zones, {noData}) — terminal", () => dsRoot.zonalStats([{ id: 1, polygon: leftHalf }], { noData: ND }));
run("ds.isMaterialized (post-force)", () => dsRoot.isMaterialized);
run("ds.release()", () => { dsRoot.release(); return dsRoot.isMaterialized; });             // drop memoized decode
run("ds.toRecord()", () => dsRoot.toRecord());                                              // → structured-cloneable record
run("ds.toRecord() of a derived op node", () => dsRoot.reclassify([{ min: 2, value: 7 }]).toRecord());
await runA("ds.toRecord({storeMaterialized:true})", async () => { await dsRoot.load(); return dsRoot.toRecord({ storeMaterialized: true }); });
run("Dataset.fromRecord(record)", () => Dataset.fromRecord(dsRoot.reclassify([{ min: 2, value: 7 }]).toRecord()));
run("ds.toJSON()", () => dsRoot.toJSON());
const dsVec = FIM.dsVec = new Dataset({ name: "v.geojson", kind: "vector", format: "geojson", crs: "EPSG:4326", bounds: BOUNDS, data: GEOJSON });
await runA("await ds.features() — vector force", () => dsVec.features());
// selection axes
const dsAxis = run("new Dataset({axis:{name,unit,entries:[{coord,ref,meta}]}})", () => new Dataset({
  name: "series", kind: "raster", axis: { name: "stage", unit: "ft", entries: [
    { coord: 1, ref: "s1.tif", meta: { q: 100 } },
    { coord: 3, ref: { raster: "s3.tif", vector: "s3.geojson" }, meta: { q: 300 } },
  ] },
}));
run("ds.axis", () => dsAxis.axis);
run("ds.selectAxisEntry(1.4, {axis:0, nearest:true})", () => dsAxis.selectAxisEntry(1.4, { axis: 0, nearest: true }));
run("ds.select(1) — child URL Dataset", () => dsAxis.select(1));                            // select(coord, {axis?,nearest?,variant?,base?})
run("ds.select(3, {variant:'raster'})", () => dsAxis.select(3, { variant: "raster" }));

// ── geo/warp.js (standalone function) ───────────────────────────────────
section("warp(ds, toCrs) — geo function (same-CRS path avoids GDAL)");
await runA("warp(ds, 'EPSG:4326') → ds unchanged", () => warp(dsRoot, "EPSG:4326"));  // needs real GeoTIFF bytes + GDAL for a true warp

// ── io/storage.js ────────────────────────────────────────────────────────────
section("Storage — full IndexedDB lifecycle (all row/table/db methods)");
// new Storage({ name, version, tables, resetTablesOnUpgrade, versionMigrate })
const store = FIM.store = run("new Storage({name,version,tables,resetTablesOnUpgrade})",
  () => new Storage({ name: "fim-playground-" + Date.now(), version: 1, tables: ["files"], resetTablesOnUpgrade: true, versionMigrate: null }));
run("Storage.DELETE (sentinel)", () => String(Storage.DELETE));
run("store.name", () => store.name);
await runA("store.tables()", () => store.tables());
await runA("store.put('files','a.tif', value)", () => store.put("files", "a.tif", { hello: "world", buf: new Uint8Array([1, 2, 3]) }));  // put(table,key,value) — value stored verbatim
await runA("store.get('files','a.tif')", () => store.get("files", "a.tif"));
await runA("store.has('files','a.tif')", () => store.has("files", "a.tif"));
await runA("store.put('files','b.tif', {n:2})", () => store.put("files", "b.tif", { n: 2 }));
await runA("store.list('files')", () => store.list("files"));                                 // list(table, {keys?, range?})
await runA("store.list('files', {keys:true})", () => store.list("files", { keys: true }));
await runA("store.map('files', fn) — transform + DELETE rows", () => store.map("files", (k, v) => (k === "b.tif" ? Storage.DELETE : { ...v, touched: true })));  // map(table, (key,value)=>value|Storage.DELETE|undefined)
await runA("store.createTable('extra')", () => store.createTable("extra"));
await runA("store.dropTable('extra')", () => store.dropTable("extra"));
await runA("store.delete('files','a.tif')", () => store.delete("files", "a.tif"));
await runA("store.clear('files')", async () => { await store.put("files", "c", 1); return store.clear("files"); });   // clear one table
await runA("store.clearAll()", async () => { await store.put("files", "z", 1); return store.clearAll(); });           // wipe all tables, keep schema
await runA("store.close()", () => store.close());
await runA("store.destroy() — delete the whole database", () => store.destroy());

// ── mapProvider.js (pure parts) ──────────────────────────────────────────────
section("map providers — FimViz.mapProviders / providerAcceptsCRS / registerMapProvider, createMap");
run("FimViz.mapProviders()", () => FimViz.mapProviders());
run("FimViz.providerAcceptsCRS('google','EPSG:4326')", () => FimViz.providerAcceptsCRS("google", "EPSG:4326"));   // FimViz.providerAcceptsCRS(name, crs)
run("FimViz.providerAcceptsCRS('google','EPSG:3857')", () => FimViz.providerAcceptsCRS("google", "EPSG:3857"));
run("FimViz.registerMapProvider('null-provider', {create,…})", () => {
  // FimViz.registerMapProvider(name, { requiresApiKey?, acceptsCRS?, create, addVector?, removeVector?, fitBounds?, addRasterImage?, … })
  FimViz.registerMapProvider("null-provider", { requiresApiKey: false, acceptsCRS: () => true, create: () => ({ dummy: true }) });
  return FimViz.mapProviders();
});
await runA("createMap(el, {provider:'null-provider'})", () => createMap(document.createElement("div"), { provider: "null-provider" }));  // createMap(el, {provider,apiKey,center,zoom,mapId,mapOptions,…})

// ── layer.js: type registry + registerRuntime ────────────────────────────────
section("layer registry + registerRuntime");
run("Layer.registerType('noop-layer', factory)", () => Layer.registerType("noop-layer", (fim, opts) => new Layer({ map: fim, type: "noop-layer" })));  // Layer.registerType(type, (fim,opts)=>Layer)
run("FimViz.registerRuntime({}) — merges into the runtime seam", () => FimViz.registerRuntime({}));   // FimViz.registerRuntime({ bootstrap, getMountedMap, teardownMap, createPanel, markup })

// ── ui: pure renderers ───────────────────────────────────────────────────────
section("ui read-model renderers — renderLegend, renderStats, propsTable");
run("renderLegend(legend) — data", () => renderLegend(legend));
run("renderLegend(legend, {html:true})", () => renderLegend(legend, { html: true }));
run("renderLegend(null)", () => renderLegend(null));
run("renderStats(statsR) — data", () => renderStats(statsR));
run("renderStats(statsR, {html:true})", () => renderStats(statsR, { html: true }));
run("propsTable({name,cat})", () => propsTable({ name: "x", cat: "wet" }));
run("propsTable({}) — empty", () => propsTable({}));

// ── vendored primitives ──────────────────────────────────────────────────────
section("vendored — kml, fromArrayBuffer, shp, Loader");
run("kml(xmlDom) → GeoJSON", () => {
  const xml = `<kml xmlns="http://www.opengis.net/kml/2.2"><Document><Placemark><name>p</name>
    <Point><coordinates>-91.66,41.97,0</coordinates></Point></Placemark></Document></kml>`;
  return kml(new DOMParser().parseFromString(xml, "text/xml"));   // kml(Document) — from @tmcw/togeojson
});
run("typeof fromArrayBuffer — geotiff (needs a TIFF buffer)", () => typeof fromArrayBuffer);   // fromArrayBuffer(arrayBuffer) → GeoTIFF
run("typeof shp — shpjs (needs a shp/zip buffer)", () => typeof shp);                          // shp(buffer|url) → GeoJSON
run("new Loader({apiKey}) — Google Maps loader", () => new Loader({ apiKey: "demo-key-not-used" }));  // new Loader({apiKey,version?,libraries?})

// ═════════════════════════════════════════════════════════════════════════════
// PART B — map-coupled modules (mount a real map, then exercise them)
// ═════════════════════════════════════════════════════════════════════════════
const params = new URLSearchParams(location.search);
const provider = params.get("provider") === "google" ? "google" : "leaflet";
document.getElementById("switch").innerHTML =
  `<a href="?provider=leaflet" class="${provider === "leaflet" ? "on" : ""}">Leaflet</a> ` +
  `<a href="?provider=google" class="${provider === "google" ? "on" : ""}">Google</a>`;
document.getElementById("prov-note").textContent =
  provider === "leaflet" ? "keyless Leaflet — map-coupled calls run" : "Google — set localStorage 'fim_gmaps_key'";
const apiKey = provider === "google" ? (localStorage.getItem("fim_gmaps_key") || "") : null;

section("FimViz.mount + boot");
// FimViz.mount(target, { provider, apiKey, center, zoom, storage, mapId, mapOptions, theme, isolated, … })
const fim = FIM.fim = await runA("FimViz.mount('map', {provider,apiKey,center,zoom,storage})", () => FimViz.mount("map", {
  provider, apiKey, center: CENTER, zoom: ZOOM,
  storage: { name: "fim-inst-store-" + Date.now(), version: 1, tables: ["t"] },
}));

if (!fim || typeof fim.addLayer !== "function") {
  print("map-coupled calls SKIPPED", "mount did not return a FimMap (Google needs a key — use ?provider=leaflet)", true);
} else {
  await runMapTests(fim);
}

async function runMapTests(fim) {
  // ── FimViz namespace ─────────────────────────────────────────────────────────
  section("FimViz namespace — parseFile, current");
  await runA("FimViz.parseFile(File)", () => FimViz.parseFile(new File([JSON.stringify(GEOJSON)], "inline.geojson")));   // parseFile(source, options?)
  run("FimViz.current()", () => FimViz.current());
  // FimViz.create(target, options) / FimViz.reset() — same boot core as mount(); not re-run here (one map per default app).

  // ── FimMap instance ──────────────────────────────────────────────────────────
  section("FimMap — accessors, scoped DOM, events, actions, registries, dispatch");
  run("fim.root", () => fim.root);
  run("fim.map", () => fim.map?.constructor?.name || fim.map);
  run("fim.config", () => fim.config);
  run("fim.storage", () => fim.storage);                                        // getter → Storage (from mount's storage option)
  run("fim.layerPanel", () => fim.layerPanel);                                  // null on a bare boot (no createPanel injected)
  run("fim.map", () => fim.map?.constructor?.name);
  run("fim.$('#map')", () => fim.$("#map"));                                    // scoped querySelector
  run("fim.$$('div').length", () => fim.$$("div").length);                      // scoped querySelectorAll
  const onBus = () => { FIM.busFired = (FIM.busFired || 0) + 1; };
  run("fim.on('evt', fn)", () => fim.on("play-evt", onBus));
  run("fim.emit('evt', payload)", () => { fim.emit("play-evt", { x: 1 }); return FIM.busFired; });
  run("fim.off('evt', fn)", () => { fim.off("play-evt", onBus); return "ok"; });
  run("fim.registerAction('act', fn)", () => fim.registerAction("playAct", function () { return this; }));   // registerAction(name, fn)
  run("fim.registerActions({a,b})", () => fim.registerActions({ a: () => 1, b: () => 2 }));
  run("fim.getAction('playAct')", () => fim.getAction("playAct"));
  run("fim.actionNames", () => fim.actionNames);
  run("fim.bindActions()", () => fim.bindActions());
  await runA("fim.addDataset(File) → Dataset", () => fim.addDataset(new File([JSON.stringify(GEOJSON)], "add.geojson")));   // addDataset(source, options?)
  const vlayer = await runA("fim.addLayer('vector', {source, style})",
    () => fim.addLayer("vector", { source: dsVec, style: { fillColor: "#58a6ff", fillOpacity: 0.3, strokeColor: "#1f6feb", strokeWidth: 2 } }));  // addLayer(type, opts)
  run("fim.getLayer(id)", () => fim.getLayer(vlayer.id));
  run("fim.registerNamedLayer('named.geojson', layer)", () => fim.registerNamedLayer("named.geojson", vlayer));
  run("fim.getLayerByName('named.geojson')", () => fim.getLayerByName("named.geojson")?.id);
  run("fim.namedLayers.length", () => fim.namedLayers.length);
  run("fim.enableMapEvents(['click','hover'], {simultaneous:false})", () => fim.enableMapEvents(["click", "hover"], { simultaneous: false }));
  run("fim.simultaneousLayerEvents = true", () => { fim.simultaneousLayerEvents = true; return fim.simultaneousLayerEvents; });
  run("fim.simultaneousLayerEvents = false", () => { fim.simultaneousLayerEvents = false; return fim.simultaneousLayerEvents; });
  run("fim.captureInteraction(handler) → release()", () => { const rel = fim.captureInteraction(() => {}); const c = fim.capturing; rel(); return { capturingWhileHeld: c, afterRelease: fim.capturing }; });
  run("fim.releaseInteraction()", () => { fim.captureInteraction(() => {}); fim.releaseInteraction(); return fim.capturing; });
  run("fim.exclusiveClaimant", () => fim.exclusiveClaimant);
  run("fim.disableMapEvents()", () => fim.disableMapEvents());
  fim.enableMapEvents(["click", "hover"]);   // re-enable for the UI bindings below

  // ── RasterLayer ──────────────────────────────────────────────────────────────
  section("RasterLayer — construct, render pipeline, read-models, settings, hit-test");
  // new RasterLayer({ map, type, sources, id, exclusive, noData, opacity })
  const rl = FIM.rasterLayer = run("new RasterLayer({map,type,sources,noData,opacity,exclusive})",
    () => new RasterLayer({ map: fim, type: "userRaster", sources: [new Dataset({ name: "r.tif", kind: "raster", format: "demo", crs: "EPSG:4326", bounds: BOUNDS, data: {} })], noData: ND, opacity: 0.85, exclusive: false }));
  await runA("rl.compute()", () => rl.compute());                                 // force sources → this.result
  await runA("rl.render({render:'auto'})", () => rl.render({ render: "auto" }));   // render({ render:'auto'|'in-place'|'recreate' })
  run("rl.fit()", () => rl.fit());
  run("rl.set({ colorScale: cs })", () => rl.set({ colorScale: new ColorScale({ palette: "viridis", min: 0, max: 46, continuous: true, unit: "m" }) }));
  run("rl.getLegend()", () => rl.getLegend());
  await runA("rl.getStats({filter})", () => rl.getStats({ filter: new SpatialFilter(leftHalf) }));
  run("rl.valueAt(center) — inside", () => rl.valueAt(CENTER.lat, CENTER.lng));   // valueAt(lat, lng) → number|null
  run("rl.valueAt(0,0) — outside", () => rl.valueAt(0, 0));
  run("rl.hitTest(center)", () => rl.hitTest(CENTER.lat, CENTER.lng));            // hitTest(lat, lng) — pixel-level
  run("rl._bounds()", () => rl._bounds());
  run("rl.setNoData(v)", () => rl.setNoData(ND) && "set");
  run("rl.setOpacity(0.6)", () => rl.setOpacity(0.6) && "set");
  run("rl.settings.get() — whole bag", () => rl.settings.get());
  run("rl.settings.get('hover')", () => rl.settings.get("hover"));
  await runA("rl.settings.set({palette,opacity,noData,hover})", () => rl.settings.set({ palette: "heat", opacity: 0.7, noData: ND, hover: true }));  // set(partial)
  await runA("rl.settings.reset()", () => rl.settings.reset());
  await runA("rl.set({opacity:0.8}) — sugar", () => rl.set({ opacity: 0.8 }));
  run("rl.get() — sugar", () => rl.get());
  run("rl.on/once/emit('ping')", () => { let n = 0; rl.on("ping", () => n++); rl.once("ping", () => n++); rl.emit("ping"); return n; });   // on(evt,fn)/once/emit(evt,payload)
  run("rl.off('p2', fn)", () => { const f = () => {}; rl.on("p2", f); rl.off("p2", f); return "ok"; });
  run("rl.hide() / show()", () => { rl.hide(); const h = rl.visible; rl.show(); return { afterHide: h, afterShow: rl.visible }; });
  await runA("rl.deriveSources(fn) — hot-modify (reclassify)", () => rl.deriveSources(([ds]) => [ds.reclassify([{ min: 5, max: 40, value: 1 }], { unmatched: "keep" })], { render: "in-place" }));  // deriveSources(current=>next, opts)
  await runA("rl.setSources(ds) — cold swap", () => rl.setSources(new Dataset({ name: "r2.tif", kind: "raster", format: "demo2", crs: "EPSG:4326", bounds: BOUNDS, data: {} }), { render: "in-place" }));  // setSources(ds|ds[], opts)
  run("rl.toJSON()", () => rl.toJSON());

  // ── VectorLayer ──────────────────────────────────────────────────────────────
  section("VectorLayer — render, setStyle, hit-test, featureAt, settings");
  const vl = FIM.vectorLayer = run("new VectorLayer({map,type,sources})", () => new VectorLayer({ map: fim, type: "geojson", sources: [dsVec] }));
  run("vl.render({style})", () => vl.render({ style: { fillColor: "#3fb950", fillOpacity: 0.4, strokeColor: "#238636", strokeWidth: 2 } }));  // neutral style vocab
  run("vl.fit()", () => vl.fit());
  run("vl.setStyle({fillColor})", () => vl.setStyle({ fillColor: "#d29922" }));   // setStyle(patch) — re-adds with merged style
  run("vl.featureAt(center)", () => vl.featureAt(CENTER.lat, CENTER.lng)?.properties);  // featureAt(lat,lng) → feature|null
  run("vl.hitTest(center)", () => vl.hitTest(CENTER.lat, CENTER.lng));
  run("vl.getLegend() — base null", () => vl.getLegend());
  await runA("vl.settings.set({color,opacity,hover})", () => vl.settings.set({ color: "#a371f7", opacity: 0.5, hover: true }));

  // ── ComparisonLayer ──────────────────────────────────────────────────────────
  section("ComparisonLayer — compute, prepare, getAligned, metricsForMask + addLayer");
  const cmp = FIM.comparisonLayer = run("new ComparisonLayer({map, sources:[{pixels,meta}×2]})", () => new ComparisonLayer({ map: fim, sources: [extentA, extentB] }));
  run("cmp.compute({policy,method,colors,dryValue,mask})", () => cmp.compute({ policy: "high", method: "nearest", colors: null, dryValue: ND, mask: null }));  // policy: low|high|average
  run("cmp.getAligned()", () => cmp.getAligned()?.length);
  run("cmp.metricsForMask(mask)", () => cmp.metricsForMask(leftHalf));            // metricsForMask(polygon) → 2-ary confusion matrix
  await runA("cmp.prepare() — Dataset sources → grids", () => cmp.prepare());
  await runA("fim.addLayer('comparison', {sources,policy})", () => fim.addLayer("comparison", { sources: [extentA, extentB], policy: "high" }));

  // ── EnsembleAggregationLayer ──────────────────────────────────────────────────
  section("EnsembleAggregationLayer — compute, getAligned + addLayer");
  const ens = FIM.ensembleLayer = run("new EnsembleAggregationLayer({map, sources:[×3]})", () => new EnsembleAggregationLayer({ map: fim, sources: [extentA, extentB, extentC] }));
  run("ens.compute({policy,method,colors,dryValue})", () => ens.compute({ policy: "high", method: "nearest", colors: null, dryValue: ND }));
  run("ens.getAligned()", () => ens.getAligned()?.length);
  await runA("fim.addLayer('ensembleAgreement', {sources})", () => fim.addLayer("ensembleAgreement", { sources: [extentA, extentB, extentC] }));

  // ── UI module: map-anchored widgets ──────────────────────────────────────────
  section("ui widgets — toast, tooltip, infoWindow, tools panel, region draw, ops");
  const toast = FIM.toast = run("createToast(document.body, {corner:'br'})", () => createToast(document.body, { corner: "br" }));   // createToast(root?, {corner})
  run("toast.show(msg, {level,timeout})", () => toast.show("playground: hello", { level: "success", timeout: 1500 }) && "shown");   // level: info|success|warn|error
  run("toast.clear()", () => { toast.clear(); return "cleared"; });
  run("connectToast(fim, toast)", () => { connectToast(fim, toast); fim.emit("notify", { message: "via bus", level: "info" }); return "wired"; });
  const tip = FIM.tooltip = run("createTooltip(fim, {style})", () => createTooltip(fim, { style: { background: "#000" } }));
  run("tooltip.show(evt, html)", () => { tip.show({ originalEvent: { clientX: 40, clientY: 40 } }, "42 m"); return "shown"; });
  run("tooltip.hide()", () => { tip.hide(); return "hidden"; });
  const hb = run("bindHoverValue(rl, {tooltip,format})", () => bindHoverValue(rl, { tooltip: tip, format: (v) => `${v.toFixed(1)} m` }));   // → {tooltip, off}
  run("hoverBinding.off()", () => { hb.off(); return "off"; });
  const iw = FIM.infoWindow = run("createInfoWindow(fim, {style})", () => createInfoWindow(fim, { style: {} }));
  run("infoWindow.open(evt, html)", () => { iw.open({ originalEvent: { clientX: 60, clientY: 60 } }, propsTable({ a: 1 })); return "open"; });
  run("infoWindow.close()", () => { iw.close(); return "closed"; });
  const fb = run("bindFeatureInfo(vl, {infoWindow,render})", () => bindFeatureInfo(vl, { infoWindow: iw, render: (f) => propsTable(f.properties) }));   // → {infoWindow, off}
  run("featureInfoBinding.off()", () => { fb.off(); return "off"; });
  run("rasterControls(rl)", () => rasterControls(rl));                            // → Control[] spec
  run("vectorControls(vl)", () => vectorControls(vl));
  const tp = FIM.toolsPanel = run("createToolsPanel('#host-tools', {layer, pretty:true})", () => createToolsPanel("#host-tools", { layer: rl, pretty: true }));   // createToolsPanel(root, {layer, controls?, pretty?})
  run("createToolsPanel('#host-tools2', {layer, controls:vectorControls})", () => createToolsPanel("#host-tools2", { layer: vl, controls: vectorControls, pretty: false }));
  run("toolsPanel.update()", () => { tp.update(); return "updated"; });
  const rd = FIM.regionDraw = run("createRegionDraw(fim, {onPoint,onComplete,onCancel})", () => createRegionDraw(fim, { onPoint: () => {}, onComplete: () => {}, onCancel: () => {} }));
  run("regionDraw.start()", () => { rd.start(); return rd.active; });            // modal capture; click the map to add vertices
  run("regionDraw.points", () => rd.points);
  run("regionDraw.active", () => rd.active);
  run("regionDraw.finish() — <3 pts → null", () => rd.finish());                 // → SpatialFilter|null
  run("regionDraw.cancel()", () => { rd.start(); rd.cancel(); return rd.active; });
  FIM.opsPanel = run("createOperationsPanel('#host-ops', {layer, region, pretty})", () => createOperationsPanel("#host-ops", { layer: rl, region: () => leftHalf, pretty: true, onApply: () => {} }));  // createOperationsPanel(root, {layer, region?, pretty?, onApply?})

  // fim.destroy() — teardown; behind the button above so the map stays interactive.
  section("done — every method above is on window.FIM; edit any call & reload");
}

// opt-in buttons for the file-writing / teardown methods (not auto-run)
document.getElementById("btn-download-ds").addEventListener("click", () => dsRoot.download());                     // Dataset.download()
document.getElementById("btn-download-stats").addEventListener("click", () => statsR.download("playground-stats.csv")); // Stats.download(name)
document.getElementById("btn-destroy").addEventListener("click", () => { FIM.fim?.destroy(); alert("fim.destroy() called — map torn down."); });

console.log("[fimviz] method playground ready — poke window.FIM in the console.");
</script>
</body>
