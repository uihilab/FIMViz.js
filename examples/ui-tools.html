<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FIMViz — UI components</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2b3440; --fg:#e6edf3; --dim:#8b949e;
          --ok:#3fb950; --bad:#f85149; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg);
         color:var(--fg); font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; gap:12px;
           align-items:baseline; flex-wrap:wrap; }
  h1 { margin:0; font-size:16px; }
  header span { color:var(--dim); font-size:12.5px; }
  main { flex:1; display:grid; grid-template-columns:290px 1fr; min-height:0; }
  #side { overflow:auto; padding:14px; border-right:1px solid var(--line);
          display:flex; flex-direction:column; gap:16px; }
  #map { height:100%; }
  h2 { margin:0 0 7px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  button { background:transparent; color:var(--accent); border:1px solid var(--line); border-radius:6px;
           padding:4px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#08111f; font-weight:600; }
  code { background:#0f1216; border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:12px; }
  .none { color:var(--dim); font-size:12px; }
</style>
</head>
<body>

<header>
  <h1>FIMViz — UI components</h1>
  <span>Everything on the left is a <code>fimviz/ui</code> export, mounted the way an app would mount
        it. Serve from the repo root; run <code>npm run build</code> after editing <code>src/</code>.</span>
</header>

<main>
  <div id="side">
    <div>
      <h2>Layers <span id="hint-layers"></span></h2>
      <div id="layers"></div>
    </div>

    <div>
      <h2>Selection</h2>
      <div class="row">
        <button id="draw">Draw region</button>
        <button id="finish">Finish</button>
        <button id="clear">Clear</button>
      </div>
    </div>

    <div>
      <h2>Layer settings</h2>
      <div id="tools"></div>
    </div>

    <div>
      <h2>Operations</h2>
      <div id="ops"></div>
    </div>

    <div>
      <h2>Legend</h2>
      <div id="legend"></div>
    </div>

    <div>
      <h2>Statistics</h2>
      <div id="stats"></div>
    </div>
  </div>

  <div id="map"></div>
</main>

<script type="importmap">
{ "imports": { "fimviz": "../dist/fimviz.js", "fimviz/ui": "../dist/ui.js" } }
</script>

<script type="module">
import { FimViz, Legend } from "fimviz";
import {
  createToast, connectToast, createToolsPanel, createOperationsPanel,
  createTooltip, bindHoverValue, createInfoWindow, bindFeatureInfo,
  createRegionDraw, createLayerPanel, createLayerSelect,
  renderLegend, renderStats, layerLabel,
} from "fimviz/ui";

const $ = (s) => document.querySelector(s);

// Toast first, so anything that fails below is visible on the page and not only in the console.
const toast = createToast(document.body);

const fim = await FimViz.mount("#map", { provider: "leaflet" });
connectToast(fim, toast);

const raster = await fim.addLayer(await fim.addDataset("../assets/SampleFiles/Compare_0-0-DEP-12840.tif"));
const lakes = await fim.addLayer(await fim.addDataset("../assets/SampleFiles/iowa_lakes_meta.geojson"));
fim.enableMapEvents(["click", "hover"]);
raster.fit();

// Hover values on the raster, feature properties on the vector. Both are passive bindings on the
// ordinary event bus, so they coexist with each other and with selection.
bindHoverValue(raster, { tooltip: createTooltip(fim) });
bindFeatureInfo(lakes, { infoWindow: createInfoWindow(fim) });

// ── the panels ──────────────────────────────────────────────────────────────────────────
// One selected layer drives the settings and operations panels. The layer list and map clicks are
// two ways of choosing it; both route through the same setter so they cannot disagree.
let selected = raster;
let regionFilter = null;
let toolsPanel = null, opsPanel = null;

function refresh() {
  toolsPanel?.destroy();
  opsPanel?.destroy();
  toolsPanel = createToolsPanel("#tools", { layer: selected, pretty: true });
  opsPanel = createOperationsPanel("#ops", {
    layer: selected, pretty: true,
    region: () => regionFilter,
    onApply: (l, err) => {
      toast.show(err ? `Operation failed — ${err.message}` : "Applied",
        { level: err ? "error" : "success" });
      if (!err) readModels();
    },
  });
  $("#hint-layers").textContent = `· ${layerLabel(selected)}`;
  readModels();
}

async function readModels() {
  $("#legend").innerHTML = selected.colorScale
    ? renderLegend(Legend.fromColorScale(selected.colorScale), { html: true })
    : "<span class='none'>no colour scale</span>";
  try {
    $("#stats").innerHTML = renderStats(
      await selected.getStats({ filter: regionFilter ?? undefined }), { html: true });
  } catch {
    $("#stats").innerHTML = "<span class='none'>—</span>";   // a vector layer has no raster stats
  }
}

function select(layer) {
  if (!layer) return;
  selected = layer;
  refresh();
}

const layerPanel = createLayerPanel("#layers", {
  fim, pretty: true, selected,
  onSelect: select,
  onRemove: (l) => toast.show(`Removed ${layerLabel(l)}`),
});

// Clicking the map selects too — and clicking the SAME spot again cycles through whatever overlaps
// there, which is the only way to reach a layer buried under another.
createLayerSelect(fim, { fit: false, onSelect: (l) => layerPanel.select(l) });

// ── region draw ─────────────────────────────────────────────────────────────────────────
let regionDraw = null;

$("#draw").addEventListener("click", () => {
  $("#draw").classList.add("on");
  regionDraw = createRegionDraw(fim, {
    onPoint: (pts) => toast.show(`${pts.length} point${pts.length === 1 ? "" : "s"}`, { timeout: 900 }),
    onComplete: (filter, pts) => {
      $("#draw").classList.remove("on");
      regionFilter = filter;
      if (!filter) return toast.show(`Need at least 3 points (got ${pts.length})`, { level: "warn" });
      toast.show(`Region of ${pts.length} points — statistics are scoped to it`, { level: "success" });
      readModels();
    },
    onCancel: () => $("#draw").classList.remove("on"),
  });
  regionDraw.start();
  toast.show("Click at least 3 points on the map, then Finish");
});
$("#finish").addEventListener("click", () => regionDraw?.finish());
$("#clear").addEventListener("click", () => {
  regionDraw?.cancel();
  regionFilter = null;
  readModels();
  toast.show("Region cleared");
});

refresh();
console.log("[fimviz] ui components ready");
</script>
</body>
</html>
