  <text x="30" y="660" font-size="11.5" fill="#475569">Components, not directories. <tspan font-weight="700">src/package/</tspan> spans three tiers, so collapsing by directory yields edges in both directions between</text>
  <text x="30" y="677" font-size="11.5" fill="#475569">package↔geo and package↔io and hides that the graph is a DAG. The <tspan font-weight="700" fill="#92400e">GDAL warp provider</tspan> is drawn amber because it depends on the</text>
  <text x="30" y="694" font-size="11.5" fill="#475569">primitives and registers itself back into them — the inversion that keeps the seam one-directional (Fig. 3.1).</text>
  <text x="30" y="715" font-size="10.5" fill="#94a3b8">Generated by figures/build-fig-3-2.mjs from src/ — re-run to regenerate.</text>
