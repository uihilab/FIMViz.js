<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>FIMViz.js deferred work — build, force, reuse</title>
  <desc>A four-operation chain is built without fetching, decoding or computing anything. A single
        terminal call crosses the force boundary and runs every stage once, memoizing the result on
        the node. Three things are deferred: the source bytes, the computation, and the decoder
        module itself, which arrives by dynamic import at the first forced reprojection.</desc>

  <defs>
    <marker id="lazy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
    <marker id="render" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="ghost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="1180" height="690" fill="#ffffff"/>

  <!-- ═══════════════ BUILD ═════════════════════════════════════════════════════════════ -->
  <rect x="24" y="26" width="852" height="148" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="48" font-size="13.5" font-weight="700" fill="#0f172a">BUILD <tspan font-weight="400" font-size="11.5" fill="#475569">— each call returns a new Dataset carrying one operation descriptor</tspan></text>

  <rect x="44" y="62" width="146" height="56" rx="7" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="117" y="82" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a" text-anchor="middle">Dataset.fromURL(</text>
  <text x="117" y="95" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a" text-anchor="middle">'dem_3035.tif')</text>
  <text x="117" y="110" font-size="9" fill="#64748b" text-anchor="middle">root — a URL, not bytes</text>

  <rect x="210" y="62" width="146" height="56" rx="7" fill="#ffffff" stroke="#a8bdd4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="283" y="88" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a" text-anchor="middle">.reproject('EPSG:4326')</text>
  <text x="283" y="105" font-size="9" fill="#64748b" text-anchor="middle">parent + one op</text>

  <rect x="376" y="62" width="146" height="56" rx="7" fill="#ffffff" stroke="#a8bdd4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="449" y="88" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a" text-anchor="middle">.clip(aoi)</text>
  <text x="449" y="105" font-size="9" fill="#64748b" text-anchor="middle">parent + one op</text>

  <rect x="542" y="62" width="146" height="56" rx="7" fill="#ffffff" stroke="#a8bdd4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="615" y="88" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a" text-anchor="middle">.slope()</text>
  <text x="615" y="105" font-size="9" fill="#64748b" text-anchor="middle">parent + one op</text>

  <rect x="708" y="62" width="146" height="56" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="781" y="88" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12" text-anchor="middle">.grid()</text>
  <text x="781" y="105" font-size="9" font-weight="700" fill="#9a3412" text-anchor="middle">TERMINAL</text>

  <line x1="192" y1="90" x2="206" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#lazy)"/>
  <line x1="358" y1="90" x2="372" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#lazy)"/>
  <line x1="524" y1="90" x2="538" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#lazy)"/>
  <line x1="690" y1="90" x2="704" y2="90" stroke="#ea580c" stroke-width="1.8" marker-end="url(#force)"/>

  <rect x="44" y="128" width="644" height="30" rx="6" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="147" font-size="10.5" fill="#334155">After four calls: <tspan font-weight="700" fill="#0f172a">0 bytes fetched · 0 pixels decoded · 0 operations run · no GDAL, no reader wasm loaded</tspan></text>

  <!-- ═══════════════ FORCE BOUNDARY ════════════════════════════════════════════════════ -->
  <line x1="24" y1="192" x2="876" y2="192" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="7 5"/>
  <rect x="330" y="180" width="240" height="24" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="450" y="196" font-size="10.5" font-weight="700" fill="#9a3412" text-anchor="middle">FORCE BOUNDARY — one terminal call</text>

  <!-- ═══════════════ EXECUTE ═══════════════════════════════════════════════════════════ -->
  <rect x="24" y="216" width="852" height="212" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="40" y="238" font-size="13.5" font-weight="700" fill="#0f172a">EXECUTE <tspan font-weight="400" font-size="11.5" fill="#475569">— the whole chain runs once, in order, and the result is memoized on the node</tspan></text>

  <rect x="44" y="252" width="124" height="54" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="106" y="274" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">fetch</text>
  <text x="106" y="290" font-size="9" fill="#64748b" text-anchor="middle">whole file, one read</text>

  <rect x="180" y="252" width="124" height="54" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="242" y="274" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">materialize</text>
  <text x="242" y="290" font-size="9" fill="#64748b" text-anchor="middle">geotiff → RasterGrid</text>

  <rect x="316" y="252" width="124" height="54" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="378" y="274" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">warp</text>
  <text x="378" y="290" font-size="9" fill="#64748b" text-anchor="middle">3035 → 4326</text>

  <rect x="452" y="252" width="124" height="54" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="514" y="274" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">clip</text>
  <text x="514" y="290" font-size="9" fill="#64748b" text-anchor="middle">window read on the grid</text>

  <rect x="588" y="252" width="124" height="54" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="650" y="274" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">slope</text>
  <text x="650" y="290" font-size="9" fill="#64748b" text-anchor="middle">Horn, 3 × 3 kernel</text>

  <rect x="724" y="252" width="130" height="54" rx="7" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="789" y="274" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">RasterGrid</text>
  <text x="789" y="290" font-size="9" fill="#1e40af" text-anchor="middle">memoized on the node</text>

  <line x1="170" y1="279" x2="176" y2="279" stroke="#d97706" stroke-width="1.4" marker-end="url(#force)"/>
  <line x1="306" y1="279" x2="312" y2="279" stroke="#d97706" stroke-width="1.4" marker-end="url(#force)"/>
  <line x1="442" y1="279" x2="448" y2="279" stroke="#d97706" stroke-width="1.4" marker-end="url(#force)"/>
  <line x1="578" y1="279" x2="584" y2="279" stroke="#d97706" stroke-width="1.4" marker-end="url(#force)"/>
  <line x1="714" y1="279" x2="720" y2="279" stroke="#d97706" stroke-width="1.4" marker-end="url(#force)"/>

  <!-- stage-boundary brackets, tied to the timing names fixed in Section 4.1 -->
  <path d="M44,318 L44,326 L168,326 L168,318" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="106" y="340" font-size="9.5" font-style="italic" fill="#475569" text-anchor="middle">t_fetch</text>
  <path d="M180,318 L180,326 L304,326 L304,318" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="242" y="340" font-size="9.5" font-style="italic" fill="#475569" text-anchor="middle">t_decode</text>
  <path d="M316,318 L316,326 L712,326 L712,318" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="514" y="340" font-size="9.5" font-style="italic" fill="#475569" text-anchor="middle">t_op</text>
  <path d="M44,350 L44,358 L854,358 L854,350" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text x="650" y="372" font-size="9.5" font-style="italic" fill="#334155" text-anchor="middle">t_total — the stage boundaries Section 4.1 measures against</text>

  <rect x="316" y="384" width="538" height="32" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="330" y="404" font-size="10.5" fill="#334155"><tspan font-weight="700" fill="#9a3412">gdal3.js is imported here</tspan>, at the first forced warp — never on package import.</text>
  <line x1="378" y1="308" x2="378" y2="382" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#force)"/>

  <!-- ═══════════════ REUSE ═════════════════════════════════════════════════════════════ -->
  <rect x="24" y="446" width="852" height="152" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="468" font-size="13.5" font-weight="700" fill="#0f172a">REUSE <tspan font-weight="400" font-size="11.5" fill="#475569">— the memoized grid is what every later rendering reads</tspan></text>

  <text x="44" y="490" font-size="10.5" font-weight="700" fill="#334155">One decode, N renderings</text>
  <rect x="44" y="500" width="150" height="42" rx="7" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="119" y="519" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">forced Dataset</text>
  <text x="119" y="534" font-size="9" fill="#1e40af" text-anchor="middle">one read</text>

  <rect x="222" y="486" width="120" height="34" rx="6" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="282" y="507" font-size="10" fill="#0f172a" text-anchor="middle">raster layer</text>
  <rect x="222" y="524" width="120" height="34" rx="6" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="282" y="545" font-size="10" fill="#0f172a" text-anchor="middle">reclassified</text>
  <rect x="222" y="562" width="120" height="30" rx="6" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="282" y="582" font-size="10" fill="#0f172a" text-anchor="middle">comparison</text>
  <line x1="196" y1="521" x2="210" y2="521" stroke="#475569" stroke-width="1.3"/>
  <line x1="210" y1="503" x2="210" y2="577" stroke="#475569" stroke-width="1.3"/>
  <line x1="210" y1="503" x2="216" y2="503" stroke="#475569" stroke-width="1.3" marker-end="url(#render)"/>
  <line x1="210" y1="541" x2="216" y2="541" stroke="#475569" stroke-width="1.3" marker-end="url(#render)"/>
  <line x1="210" y1="577" x2="216" y2="577" stroke="#475569" stroke-width="1.3" marker-end="url(#render)"/>

  <line x1="360" y1="482" x2="360" y2="588" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="386" y="490" font-size="10.5" font-weight="700" fill="#64748b">Without the shared node</text>
  <rect x="386" y="500" width="150" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="461" y="519" font-size="10.5" fill="#64748b" text-anchor="middle">three chains</text>
  <text x="461" y="534" font-size="9" fill="#94a3b8" text-anchor="middle">three reads, three decodes</text>
  <rect x="564" y="486" width="120" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="624" y="507" font-size="10" fill="#94a3b8" text-anchor="middle">raster layer</text>
  <rect x="564" y="524" width="120" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="624" y="545" font-size="10" fill="#94a3b8" text-anchor="middle">reclassified</text>
  <rect x="564" y="562" width="120" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="624" y="582" font-size="10" fill="#94a3b8" text-anchor="middle">comparison</text>
  <line x1="538" y1="521" x2="552" y2="521" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="552" y1="503" x2="552" y2="577" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="552" y1="503" x2="558" y2="503" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ghost)"/>
  <line x1="552" y1="541" x2="558" y2="541" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ghost)"/>
  <line x1="552" y1="577" x2="558" y2="577" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ghost)"/>

  <rect x="692" y="496" width="162" height="86" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="706" y="516" font-size="10.5" font-weight="700" fill="#0f172a">The measurement</text>
  <text x="706" y="533" font-size="9.5" fill="#475569">Section 4.4 reports the ratio</text>
  <text x="706" y="547" font-size="9.5" fill="#475569">between the two columns, and</text>
  <text x="706" y="561" font-size="9.5" fill="#475569">the cost of a chain that is built</text>
  <text x="706" y="575" font-size="9.5" fill="#475569">and never forced.</text>

  <!-- ═══════════════ SIDE PANEL: THE THREE DEFERRALS ═══════════════════════════════════ -->
  <rect x="892" y="26" width="264" height="572" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="908" y="48" font-size="12.5" font-weight="700" fill="#0f172a">THREE DEFERRALS</text>
  <line x1="908" y1="58" x2="1140" y2="58" stroke="#e2e8f0" stroke-width="1.2"/>

  <text x="908" y="84" font-size="11" font-weight="700" fill="#1e40af">1 · Source bytes</text>
  <text x="908" y="101" font-size="9.5" fill="#475569">Held until a terminal call. Opening</text>
  <text x="908" y="114" font-size="9.5" fill="#475569">a file costs a URL and a header,</text>
  <text x="908" y="127" font-size="9.5" fill="#475569">so a catalog of forty products</text>
  <text x="908" y="140" font-size="9.5" fill="#475569">reads only the ones rendered.</text>
  <text x="908" y="157" font-size="9.5" fill="#64748b" font-style="italic">Dataset.fromURL · #materializeRoot</text>

  <line x1="908" y1="176" x2="1140" y2="176" stroke="#eef2f6" stroke-width="1.2"/>

  <text x="908" y="200" font-size="11" font-weight="700" fill="#1e40af">2 · Computation</text>
  <text x="908" y="217" font-size="9.5" fill="#475569">Eleven operations return a new</text>
  <text x="908" y="230" font-size="9.5" fill="#475569">node and compute nothing. The</text>
  <text x="908" y="243" font-size="9.5" fill="#475569">chain runs once, at the terminal,</text>
  <text x="908" y="256" font-size="9.5" fill="#475569">and the decode is memoized.</text>
  <text x="908" y="273" font-size="9.5" fill="#64748b" font-style="italic">#derive · #applyOp · release()</text>

  <line x1="908" y1="292" x2="1140" y2="292" stroke="#eef2f6" stroke-width="1.2"/>

  <text x="908" y="316" font-size="11" font-weight="700" fill="#1e40af">3 · Decoder modules</text>
  <text x="908" y="333" font-size="9.5" fill="#475569">The package barrel registers a</text>
  <text x="908" y="346" font-size="9.5" fill="#475569">loader, not a decoder. GDAL and</text>
  <text x="908" y="359" font-size="9.5" fill="#475569">the multi-dimensional readers</text>
  <text x="908" y="372" font-size="9.5" fill="#475569">arrive by dynamic import, on</text>
  <text x="908" y="385" font-size="9.5" fill="#475569">first use and never before.</text>
  <text x="908" y="402" font-size="9.5" fill="#64748b" font-style="italic">registerDefaultReprojectorLoader</text>

  <line x1="908" y1="421" x2="1140" y2="421" stroke="#e2e8f0" stroke-width="1.2"/>

  <text x="908" y="445" font-size="11" font-weight="700" fill="#0f172a">What forces a chain</text>
  <rect x="908" y="456" width="106" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="961" y="472" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12" text-anchor="middle">grid()</text>
  <rect x="1022" y="456" width="118" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="1081" y="472" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12" text-anchor="middle">features()</text>
  <rect x="908" y="486" width="106" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="961" y="502" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12" text-anchor="middle">load()</text>
  <rect x="1022" y="486" width="118" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="1081" y="502" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12" text-anchor="middle">stats()</text>
  <rect x="908" y="516" width="106" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="961" y="532" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12" text-anchor="middle">zonalStats()</text>
  <rect x="1022" y="516" width="118" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="1081" y="532" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12" text-anchor="middle">groupBy()</text>

  <text x="908" y="562" font-size="9.5" fill="#475569">toRecord() serializes the chain</text>
  <text x="908" y="576" font-size="9.5" fill="#475569">without forcing it.</text>

  <!-- ═══════════════ LEGEND AND TAKEAWAY ══════════════════════════════════════════════ -->
  <line x1="24" y1="618" x2="1156" y2="618" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="30" y1="634" x2="52" y2="634" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lazy)"/>
  <text x="60" y="638" font-size="10" fill="#475569">lazy — derives a node</text>
  <line x1="196" y1="634" x2="218" y2="634" stroke="#ea580c" stroke-width="1.6" marker-end="url(#force)"/>
  <text x="226" y="638" font-size="10" fill="#475569">forced — reads or computes</text>
  <line x1="404" y1="634" x2="426" y2="634" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ghost)"/>
  <text x="434" y="638" font-size="10" fill="#475569">the path avoided</text>
  <rect x="566" y="627" width="16" height="13" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="590" y="638" font-size="10" fill="#475569">decoded and held in memory</text>

  <text x="24" y="666" font-size="11.5" font-weight="700" fill="#0f172a">Four calls cost nothing; one call costs everything, once.</text>
  <text x="24" y="682" font-size="11" fill="#475569">The chain is a description until a terminal reads it, so a host composes freely and pays at a boundary it chooses. Sections 4.2 to 4.4 measure each stage above.</text>
</svg>
