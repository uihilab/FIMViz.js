<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>FIMViz.js selection axis — one model for multi-file and in-file series</title>
  <desc>A multi-dimensional file, a set of separate files, and named variants at one coordinate all
        produce the same axis object. Two independent flags on the axis, ordered and commensurable,
        decide which selection and reduction verbs are legal, so a band or variable axis is safe by
        construction. Every reader assumption is a default with an explicit override beside it.</desc>

  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1180" height="680" fill="#ffffff"/>

  <!-- ═══════════════ COLUMN HEADERS ═══════════════════════════════════════════════════ -->
  <text x="24" y="42" font-size="12.5" font-weight="700" fill="#0f172a">THREE SOURCE SHAPES</text>
  <text x="344" y="42" font-size="12.5" font-weight="700" fill="#0f172a">ONE AXIS OBJECT</text>
  <text x="754" y="42" font-size="12.5" font-weight="700" fill="#0f172a">TWO FLAGS, INDEPENDENT</text>

  <!-- ── sources ─────────────────────────────────────────────────────────────────────── -->
  <rect x="24" y="56" width="290" height="64" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="38" y="76" font-size="10.5" font-weight="700" fill="#0f172a">One multi-dimensional file</text>
  <text x="38" y="92" font-size="9.5" fill="#475569">NetCDF3 · NetCDF4 · GRIB2 · Zarr — 120 steps</text>
  <text x="38" y="110" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">ref: { select: … } — a slice of bytes already held</text>

  <rect x="24" y="128" width="290" height="64" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="38" y="148" font-size="10.5" font-weight="700" fill="#0f172a">Several separate files</text>
  <text x="38" y="164" font-size="9.5" fill="#475569">one product per coordinate — a scenario stage set</text>
  <text x="38" y="182" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">ref: 'stage_19.5.tif' — a URL per entry</text>

  <rect x="24" y="200" width="290" height="64" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="38" y="220" font-size="10.5" font-weight="700" fill="#0f172a">Named variants at one coordinate</text>
  <text x="38" y="236" font-size="9.5" fill="#475569">one datum, two encodings — not an axis, since a</text>
  <text x="38" y="250" font-size="9.5" fill="#475569">variant switches kind, CRS, and bounds</text>
  <text x="38" y="262" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">ref: { raster: …, vector: … }</text>

  <path d="M316,88 L330,88 L330,150 L340,150" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ax)"/>
  <path d="M316,160 L340,160" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ax)"/>
  <path d="M316,232 L330,232 L330,170 L340,170" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ax)"/>

  <!-- ── the axis object ─────────────────────────────────────────────────────────────── -->
  <rect x="344" y="56" width="380" height="208" rx="7" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="360" y="78" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">ds.axes[0] = {</text>
  <text x="360" y="94" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  name:          'time',</text>
  <text x="360" y="110" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  unit:          'ms',</text>
  <text x="360" y="126" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  ordered:       true,</text>
  <text x="360" y="142" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  commensurable: true,</text>
  <text x="360" y="158" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  entries: [{ coord, ref, meta }, …]</text>
  <text x="360" y="174" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">}</text>
  <line x1="360" y1="188" x2="708" y2="188" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="360" y="206" font-size="9.5" fill="#1e3a8a">The three shapes on the left differ only in what</text>
  <text x="360" y="220" font-size="9.5" fill="#1e3a8a">an entry's <tspan font-family="ui-monospace, Menlo, Consolas, monospace">ref</tspan> holds. Nothing downstream reads it.</text>
  <text x="360" y="242" font-size="9.5" fill="#1e3a8a">A file that labels nothing still gets an axis: integer</text>
  <text x="360" y="256" font-size="9.5" fill="#1e3a8a">positions, with <tspan font-family="ui-monospace, Menlo, Consolas, monospace">unit === 'index'</tspan> so a picker can tell.</text>

  <!-- ── the flag table ──────────────────────────────────────────────────────────────── -->
  <rect x="754" y="56" width="402" height="208" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="770" y="78" font-size="9.5" fill="#475569">An ensemble member axis is unordered and still reducible.</text>
  <text x="770" y="92" font-size="9.5" fill="#475569">A band axis is the reverse. That is why there are two flags.</text>

  <line x1="770" y1="104" x2="1140" y2="104" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="770" y="120" font-size="10" font-weight="700" fill="#0f172a">axis</text>
  <text x="1002" y="120" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">ordered</text>
  <text x="1096" y="120" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">commensurable</text>
  <line x1="770" y1="128" x2="1140" y2="128" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="770" y="147" font-size="10" fill="#334155">time · level · stage · depth</text>
  <text x="1002" y="147" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <text x="1096" y="147" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <line x1="770" y1="156" x2="1140" y2="156" stroke="#eef2f6" stroke-width="1"/>

  <text x="770" y="175" font-size="10" fill="#334155">ensemble member</text>
  <text x="1002" y="175" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <text x="1096" y="175" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <line x1="770" y1="184" x2="1140" y2="184" stroke="#eef2f6" stroke-width="1"/>

  <text x="770" y="203" font-size="10" fill="#334155">band (red, green, near-infrared)</text>
  <text x="1002" y="203" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <text x="1096" y="203" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <line x1="770" y1="212" x2="1140" y2="212" stroke="#eef2f6" stroke-width="1"/>

  <text x="770" y="231" font-size="10" fill="#334155">variable (rainfall, air temperature)</text>
  <text x="1002" y="231" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <text x="1096" y="231" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <line x1="770" y1="240" x2="1140" y2="240" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="770" y="257" font-size="9" fill="#64748b" font-style="italic">Both default to true, matching the time and stage axes that predate the flags.</text>

  <!-- ═══════════════ THE VERBS, GATED BY THE FLAGS ════════════════════════════════════ -->
  <rect x="24" y="284" width="1132" height="146" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="306" font-size="12.5" font-weight="700" fill="#0f172a">WHAT THE AXIS PERMITS <tspan font-weight="400" font-size="11" fill="#475569">— the flags gate the verbs, so an illegal call fails at the axis rather than in the arithmetic</tspan></text>

  <rect x="40" y="318" width="212" height="96" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="54" y="337" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">select(coord)</text>
  <text x="54" y="354" font-size="9.5" fill="#475569">One slice, off the same bytes.</text>
  <text x="54" y="371" font-size="9.5" fill="#475569">Already in the source CRS, so</text>
  <text x="54" y="385" font-size="9.5" fill="#475569">no warp is triggered.</text>
  <text x="54" y="404" font-size="9" font-weight="700" fill="#166534">no flag required</text>

  <rect x="264" y="318" width="212" height="96" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="278" y="337" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">selectRange(from, to)</text>
  <text x="278" y="354" font-size="9.5" fill="#475569">Narrows the axis to a window.</text>
  <text x="278" y="371" font-size="9.5" fill="#475569">On an unordered axis it throws</text>
  <text x="278" y="385" font-size="9.5" fill="#475569">and names why.</text>
  <text x="278" y="404" font-size="9" font-weight="700" fill="#1e40af">requires ordered</text>

  <rect x="488" y="318" width="212" height="96" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="502" y="337" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">selectAxisEntry(coord)</text>
  <text x="502" y="354" font-size="9.5" fill="#475569">Lookup, with an optional nearest</text>
  <text x="502" y="371" font-size="9.5" fill="#475569">match. Finding nothing returns</text>
  <text x="502" y="385" font-size="9.5" fill="#475569">null; it is not a mistake.</text>
  <text x="502" y="404" font-size="9" font-weight="700" fill="#1e40af">nearest requires ordered</text>

  <rect x="712" y="318" width="212" height="96" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="726" y="337" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">variantsAt(coord)</text>
  <text x="726" y="354" font-size="9.5" fill="#475569">Lists the named encodings at one</text>
  <text x="726" y="371" font-size="9.5" fill="#475569">coordinate, so a picker can be</text>
  <text x="726" y="385" font-size="9.5" fill="#475569">built without catching an error.</text>
  <text x="726" y="404" font-size="9" font-weight="700" fill="#166534">no flag required</text>

  <rect x="936" y="318" width="204" height="96" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="950" y="337" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">reduce(op, { axis })</text>
  <text x="950" y="354" font-size="9.5" fill="#475569">Collapses the stack: mean, sum,</text>
  <text x="950" y="371" font-size="9.5" fill="#475569">max. Refused across bands, where</text>
  <text x="950" y="385" font-size="9.5" fill="#475569">a mean means nothing.</text>
  <text x="950" y="404" font-size="9" font-weight="700" fill="#1e40af">requires commensurable</text>

  <!-- ═══════════════ DEFAULTS AND OVERRIDES ═══════════════════════════════════════════ -->
  <rect x="24" y="446" width="1132" height="118" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="40" y="468" font-size="12.5" font-weight="700" fill="#0f172a">EVERY READER ASSUMPTION HAS AN OVERRIDE BESIDE IT <tspan font-weight="400" font-size="11" fill="#475569">— which makes a non-conforming file a configuration problem, not an unsupported one</tspan></text>

  <rect x="40" y="480" width="266" height="66" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="54" y="500" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412">grid: { bbox: […] }</text>
  <text x="54" y="518" font-size="9.5" fill="#475569">Supplies the extent when the file</text>
  <text x="54" y="532" font-size="9.5" fill="#475569">reports none.</text>

  <rect x="318" y="480" width="266" height="66" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="332" y="500" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412">series: { coords: i =&gt; … }</text>
  <text x="332" y="518" font-size="9.5" fill="#475569">Labels an axis the format cannot</text>
  <text x="332" y="532" font-size="9.5" fill="#475569">label itself.</text>

  <rect x="596" y="480" width="266" height="66" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="610" y="500" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412">dims: { order: 'yx' }</text>
  <text x="610" y="518" font-size="9.5" fill="#475569">Names which trailing pair of</text>
  <text x="610" y="532" font-size="9.5" fill="#475569">dimensions is latitude, longitude.</text>

  <rect x="874" y="480" width="266" height="66" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="888" y="500" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412">lon: '-180..180'</text>
  <text x="888" y="518" font-size="9.5" fill="#475569">Re-expresses the extent; a global</text>
  <text x="888" y="532" font-size="9.5" fill="#475569">grid is rolled to match.</text>

  <!-- ═══════════════ NOTE ═════════════════════════════════════════════════════════════ -->
  <rect x="24" y="578" width="1132" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="40" y="596" font-size="10" fill="#334155"><tspan font-weight="700" fill="#0f172a">The multi-dimensional readers sit outside the bundle.</tspan> sciwrid-toolkit loads its own wasm and workers, so a page that opens .nc, .grib2 or .zarr maps it in an</text>
  <text x="40" y="612" font-size="10" fill="#334155">import map and every other page pays nothing for it. Selection results are ordinary Datasets, so every operation in the preceding figure applies to them unchanged.</text>

  <!-- ═══════════════ TAKEAWAY ═════════════════════════════════════════════════════════ -->
  <text x="24" y="648" font-size="11.5" font-weight="700" fill="#0f172a">Which verbs are legal belongs to the axis, not to the verb.</text>
  <text x="24" y="664" font-size="11" fill="#475569">One axis object covers a time series inside a file, a stage set across files, and two encodings of one datum, and the two flags keep each of them safe by construction.</text>
</svg>
