<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Axis model</title>
  <desc>Three source shapes produce one axis object. Two flags on that object, ordered and
        commensurable, decide which operations are legal. Four reader overrides set the extent, the axis labels, the dimension
        order, and the longitude range.</desc>

  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1120" height="500" fill="#ffffff"/>

  <!-- column headers -->
  <text x="24" y="34" font-size="11.5" font-weight="700" fill="#0f172a">Three source shapes</text>
  <text x="348" y="34" font-size="11.5" font-weight="700" fill="#0f172a">One axis object</text>
  <text x="732" y="34" font-size="11.5" font-weight="700" fill="#0f172a">Two flags</text>

  <!-- sources -->
  <rect x="24" y="48" width="300" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="38" y="68" font-size="10.5" font-weight="700" fill="#0f172a">One multi-dimensional file</text>
  <text x="38" y="84" font-size="9.5" fill="#475569">NetCDF3, NetCDF4, GRIB2, Zarr</text>
  <text x="38" y="100" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">ref: { select: … }</text>

  <rect x="24" y="114" width="300" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="38" y="134" font-size="10.5" font-weight="700" fill="#0f172a">One file per coordinate</text>
  <text x="38" y="150" font-size="9.5" fill="#475569">a stage set, one product per step</text>
  <text x="38" y="166" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">ref: 'stage_19.5.tif'</text>

  <rect x="24" y="180" width="300" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="38" y="200" font-size="10.5" font-weight="700" fill="#0f172a">Named variants at one coordinate</text>
  <text x="38" y="216" font-size="9.5" fill="#475569">two encodings of one datum</text>
  <text x="38" y="232" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">ref: { raster: …, vector: … }</text>

  <path d="M326,77 L336,77 L336,133 L344,133" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ax)"/>
  <path d="M326,143 L344,143" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ax)"/>
  <path d="M326,209 L336,209 L336,153 L344,153" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ax)"/>

  <!-- axis object -->
  <rect x="348" y="48" width="360" height="190" rx="7" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="364" y="70" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">ds.axes[0] = {</text>
  <text x="364" y="86" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  name:          'time',</text>
  <text x="364" y="102" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  unit:          'ms',</text>
  <text x="364" y="118" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  ordered:       true,</text>
  <text x="364" y="134" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  commensurable: true,</text>
  <text x="364" y="150" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  entries: [{ coord, ref, meta }, …]</text>
  <text x="364" y="166" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">}</text>
  <line x1="364" y1="180" x2="692" y2="180" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="364" y="199" font-size="9.5" fill="#1e3a8a">The three shapes differ in what an entry's <tspan font-family="ui-monospace, Menlo, Consolas, monospace">ref</tspan> holds.</text>
  <text x="364" y="215" font-size="9.5" fill="#1e3a8a">An unlabeled file yields integer coordinates and</text>
  <text x="364" y="229" font-size="9.5" fill="#1e3a8a"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">unit === 'index'</tspan>.</text>

  <!-- flag table -->
  <rect x="732" y="48" width="364" height="190" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="748" y="72" font-size="10" font-weight="700" fill="#0f172a">axis</text>
  <text x="985" y="72" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">ordered</text>
  <text x="1068" y="72" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">commensurable</text>
  <line x1="748" y1="80" x2="1080" y2="80" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="748" y="102" font-size="10" fill="#334155">time, level, stage</text>
  <text x="985" y="102" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <text x="1068" y="102" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <line x1="748" y1="112" x2="1080" y2="112" stroke="#eef2f6" stroke-width="1"/>

  <text x="748" y="134" font-size="10" fill="#334155">ensemble member</text>
  <text x="985" y="134" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <text x="1068" y="134" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <line x1="748" y1="144" x2="1080" y2="144" stroke="#eef2f6" stroke-width="1"/>

  <text x="748" y="166" font-size="10" fill="#334155">band (red, green, near-infrared)</text>
  <text x="985" y="166" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <text x="1068" y="166" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <line x1="748" y1="176" x2="1080" y2="176" stroke="#eef2f6" stroke-width="1"/>

  <text x="748" y="198" font-size="10" fill="#334155">variable (rainfall, air temperature)</text>
  <text x="985" y="198" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <text x="1068" y="198" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <line x1="748" y1="208" x2="1080" y2="208" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="748" y="226" font-size="9" fill="#64748b">Both flags default to true.</text>

  <!-- operations gated by the flags -->
  <rect x="24" y="262" width="1072" height="110" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="285" font-size="11.5" font-weight="700" fill="#0f172a">The flags gate these operations</text>

  <text x="40" y="309" font-size="9.5" font-weight="700" fill="#166534">No flag</text>
  <text x="40" y="329" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">select(coord)</text>
  <text x="40" y="347" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">variantsAt(coord)</text>

  <text x="420" y="309" font-size="9.5" font-weight="700" fill="#1e40af">Requires ordered</text>
  <text x="420" y="329" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">selectRange(from, to)</text>
  <text x="420" y="347" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">selectAxisEntry(coord, { nearest })</text>

  <text x="800" y="309" font-size="9.5" font-weight="700" fill="#1e40af">Requires commensurable</text>
  <text x="800" y="329" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">reduce(op, { axis })</text>
  <text x="800" y="347" font-size="9.5" fill="#475569">A call against a false flag throws</text>
  <text x="800" y="361" font-size="9.5" fill="#475569">and names the flag.</text>

  <!-- reader overrides -->
  <rect x="24" y="392" width="1072" height="92" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="40" y="415" font-size="11.5" font-weight="700" fill="#0f172a">Reader overrides</text>

  <text x="40" y="443" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412">grid: { bbox }</text>
  <text x="40" y="461" font-size="9.5" fill="#475569">supplies the extent</text>

  <text x="306" y="443" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412">series: { coords }</text>
  <text x="306" y="461" font-size="9.5" fill="#475569">labels the axis entries</text>

  <text x="572" y="443" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412">dims: { order: 'yx' }</text>
  <text x="572" y="461" font-size="9.5" fill="#475569">names the latitude, longitude pair</text>

  <text x="838" y="443" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412">lon: '-180..180'</text>
  <text x="838" y="461" font-size="9.5" fill="#475569">rolls a global grid to that range</text>
</svg>
