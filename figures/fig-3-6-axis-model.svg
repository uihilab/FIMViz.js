<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="654" viewBox="0 0 720 654"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Axis model</title>
  <desc>Three source shapes produce one axis object. Two flags on that object, ordered and
        commensurable, decide which axis operations are legal. Four reader options set the extent,
        the axis coordinates, the dimension order, and the longitude range.</desc>

  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="720" height="654" fill="#ffffff"/>

  <!-- three source shapes -->
  <text x="20" y="30" font-size="11.5" font-weight="700" fill="#0f172a">Three source shapes</text>

  <rect x="20" y="44" width="290" height="56" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="32" y="63" font-size="10.5" font-weight="700" fill="#0f172a">One multi-dimensional file</text>
  <text x="32" y="78" font-size="9.5" fill="#475569">NetCDF3, GRIB2, or Zarr; the series is one dimension</text>
  <text x="32" y="94" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">ref: { select: … }</text>

  <rect x="20" y="110" width="290" height="56" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="32" y="129" font-size="10.5" font-weight="700" fill="#0f172a">Separate files, one per coordinate</text>
  <text x="32" y="144" font-size="9.5" fill="#475569">an ordered scenario series (stage 19.0, 19.5, 20.0 ft)</text>
  <text x="32" y="160" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">ref: 'stage_19.5.tif'</text>

  <rect x="20" y="176" width="290" height="56" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="32" y="195" font-size="10.5" font-weight="700" fill="#0f172a">Named variants at one coordinate</text>
  <text x="32" y="210" font-size="9.5" fill="#475569">one datum encoded as a raster and as a vector</text>
  <text x="32" y="226" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">ref: { raster: …, vector: … }</text>

  <path d="M312,72 L320,72 L320,100 L326,100" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ax)"/>
  <path d="M312,138 L326,138" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ax)"/>
  <path d="M312,204 L320,204 L320,176 L326,176" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ax)"/>

  <!-- one axis object -->
  <text x="330" y="30" font-size="11.5" font-weight="700" fill="#0f172a">One axis object</text>
  <rect x="330" y="44" width="370" height="132" rx="7" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="344" y="64" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">ds.axes[0] = {</text>
  <text x="344" y="80" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  name:          'time',</text>
  <text x="344" y="96" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  unit:          'ms',</text>
  <text x="344" y="112" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  ordered:       true,</text>
  <text x="344" y="128" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  commensurable: true,</text>
  <text x="344" y="144" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">  entries: [{ coord, ref, meta }, …]</text>
  <text x="344" y="160" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">}</text>

  <!-- two flags -->
  <text x="330" y="198" font-size="11.5" font-weight="700" fill="#0f172a">Two flags</text>
  <rect x="330" y="212" width="370" height="166" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="344" y="234" font-size="10" font-weight="700" fill="#0f172a">axis</text>
  <text x="575" y="234" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">ordered</text>
  <text x="655" y="234" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">commensurable</text>
  <line x1="344" y1="242" x2="686" y2="242" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="344" y="264" font-size="10" fill="#334155">time, level, stage</text>
  <text x="575" y="264" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <text x="655" y="264" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <line x1="344" y1="274" x2="686" y2="274" stroke="#eef2f6" stroke-width="1"/>

  <text x="344" y="296" font-size="10" fill="#334155">ensemble member</text>
  <text x="575" y="296" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <text x="655" y="296" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <line x1="344" y1="306" x2="686" y2="306" stroke="#eef2f6" stroke-width="1"/>

  <text x="344" y="328" font-size="10" fill="#334155">band (red, green, near-infrared)</text>
  <text x="575" y="328" font-size="11" fill="#166534" text-anchor="middle">✓</text>
  <text x="655" y="328" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <line x1="344" y1="338" x2="686" y2="338" stroke="#eef2f6" stroke-width="1"/>

  <text x="344" y="360" font-size="10" fill="#334155">variable (rainfall, air temperature)</text>
  <text x="575" y="360" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <text x="655" y="360" font-size="11" fill="#b91c1c" text-anchor="middle">✗</text>
  <line x1="344" y1="370" x2="686" y2="370" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- axis operations -->
  <rect x="20" y="398" width="330" height="236" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="420" font-size="11.5" font-weight="700" fill="#0f172a">Axis operations</text>

  <rect x="32" y="430" width="306" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="448" font-size="9.5" font-weight="700" fill="#1e40af">No flag</text>
  <text x="44" y="464" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">select(coord)</text>
  <text x="44" y="480" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">variantsAt(coord)</text>

  <rect x="32" y="496" width="306" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="514" font-size="9.5" font-weight="700" fill="#1e40af">Requires ordered</text>
  <text x="44" y="530" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">selectRange(from, to)</text>
  <text x="44" y="546" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">selectAxisEntry(coord, { nearest })</text>

  <rect x="32" y="562" width="306" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="580" font-size="9.5" font-weight="700" fill="#1e40af">Requires commensurable</text>
  <text x="44" y="596" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a">reduce(op, { axis })</text>

  <!-- reader options -->
  <rect x="370" y="398" width="330" height="236" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="386" y="420" font-size="11.5" font-weight="700" fill="#0f172a">Reader options that override file metadata</text>

  <rect x="382" y="430" width="306" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="394" y="448" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">grid: { bbox }</text>
  <text x="394" y="464" font-size="9.5" fill="#475569">sets the geographic extent</text>

  <rect x="382" y="480" width="306" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="394" y="498" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">series: { coords }</text>
  <text x="394" y="514" font-size="9.5" fill="#475569">sets the coordinate of each entry</text>

  <rect x="382" y="530" width="306" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="394" y="548" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">dims: { order: 'yx' }</text>
  <text x="394" y="564" font-size="9.5" fill="#475569">names the latitude and longitude dimensions</text>

  <rect x="382" y="580" width="306" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="394" y="598" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af">lon: '-180..180'</text>
  <text x="394" y="614" font-size="9.5" fill="#475569">rolls a global grid to that range</text>
</svg>
