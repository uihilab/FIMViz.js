<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="590" viewBox="0 0 1180 590"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>FIMViz.js — datasets, operations and maps inside one app</title>
  <desc>Files added to one app become Datasets. The app holds any number of them, the operations
        applied to them, and any number of maps, each carrying any number of Layers. A Layer hands
        the host a ColorScale with its Legend and Stats scoped by a Filter.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1180" height="590" fill="#ffffff"/>

  <!-- outside the app: the files themselves -->
  <rect x="430" y="26" width="320" height="54" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="590" y="49" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0f172a" text-anchor="middle">addDataset(file | url)</text>
  <text x="590" y="69" font-size="10" fill="#64748b" text-anchor="middle">geotiff · geojson · shapefile · kml · csv</text>

  <!-- the app holds everything below -->
  <rect x="40" y="100" width="1100" height="400" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="60" y="124" font-size="12.5" font-weight="700" fill="#334155">one app <tspan font-weight="400" fill="#64748b">— its Datasets, the operations on them, and its maps</tspan></text>

  <line x1="590" y1="82" x2="590" y2="140" stroke="#475569" stroke-width="1.7"/>
  <line x1="440" y1="140" x2="740" y2="140" stroke="#475569" stroke-width="1.7"/>
  <path d="M440,140 V156" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>
  <path d="M740,140 V156" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>

  <rect x="310" y="160" width="260" height="64" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="186" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">extent_modeled</text>
  <text x="440" y="207" font-size="10" fill="#1e40af" text-anchor="middle">geotiff</text>

  <rect x="610" y="160" width="260" height="64" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="740" y="186" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">extent_observed</text>
  <text x="740" y="207" font-size="10" fill="#1e40af" text-anchor="middle">geotiff</text>

  <rect x="886" y="160" width="44" height="64" rx="9" fill="#ffffff" stroke="#93b4dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="908" y="200" font-size="18" font-weight="700" fill="#93b4dd" text-anchor="middle">…</text>

  <text x="590" y="244" font-size="10.5" fill="#475569" text-anchor="middle">Dataset instances — one class, any number of them</text>

  <path d="M440,226 V258" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>
  <path d="M308,289 H286 V192 H306" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>

  <rect x="310" y="262" width="560" height="54" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="330" y="284" font-size="11.5" font-weight="700" fill="#0f172a">operations <tspan font-weight="400" fill="#64748b">— each returns a Dataset</tspan></text>
  <text x="330" y="304" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#334155">clip · mask · reclassify · reproject</text>

  <path d="M590,318 V346" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#o)"/>
  <text x="602" y="338" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12">addLayer()</text>

  <!-- map A -->
  <rect x="70" y="350" width="490" height="118" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="88" y="372" font-size="12.5" font-weight="700" fill="#0f172a">FimMap A <tspan font-weight="400" font-size="11" fill="#64748b">— leaflet</tspan></text>
  <rect x="88" y="384" width="200" height="68" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="188" y="410" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">Layer · raster</text>
  <text x="188" y="432" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412" text-anchor="middle">extent_modeled</text>
  <rect x="300" y="384" width="200" height="68" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="406" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">Layer · comparison</text>
  <text x="400" y="426" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412" text-anchor="middle">extent_modeled</text>
  <text x="400" y="442" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412" text-anchor="middle">extent_observed</text>
  <rect x="512" y="384" width="30" height="68" rx="8" fill="#ffffff" stroke="#e5a985" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="527" y="424" font-size="16" font-weight="700" fill="#e5a985" text-anchor="middle">…</text>

  <!-- map B -->
  <rect x="580" y="350" width="490" height="118" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="598" y="372" font-size="12.5" font-weight="700" fill="#0f172a">FimMap B <tspan font-weight="400" font-size="11" fill="#64748b">— google</tspan></text>
  <rect x="598" y="384" width="200" height="68" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="698" y="410" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">Layer · raster</text>
  <text x="698" y="432" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412" text-anchor="middle">extent_modeled</text>
  <rect x="810" y="384" width="200" height="68" rx="8" fill="#ffffff" stroke="#a8bdd4" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="910" y="410" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Layer · depth</text>
  <text x="910" y="432" font-size="10" fill="#64748b" text-anchor="middle">Google Maps only</text>
  <rect x="1022" y="384" width="30" height="68" rx="8" fill="#ffffff" stroke="#e5a985" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1037" y="424" font-size="16" font-weight="700" fill="#e5a985" text-anchor="middle">…</text>

  <!-- more maps -->
  <rect x="1086" y="350" width="38" height="118" rx="9" fill="#ffffff" stroke="#b0bccb" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1105" y="416" font-size="16" font-weight="700" fill="#b0bccb" text-anchor="middle">…</text>

  <!-- out of the app, to the host -->
  <path d="M300,470 V520" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>
  <text x="312" y="498" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#475569">getLegend() · getStats()</text>

  <rect x="160" y="524" width="280" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="300" y="542" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">ColorScale → Legend</text>
  <text x="300" y="558" font-size="9.5" fill="#64748b" text-anchor="middle">the colors, and the key to them</text>
  <rect x="480" y="524" width="280" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="620" y="542" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Filter → Stats</text>
  <text x="620" y="558" font-size="9.5" fill="#64748b" text-anchor="middle">numbers for a region, or for all of it</text>
  <text x="782" y="548" font-size="10.5" fill="#64748b">plain objects the host keeps — no map required</text>
</svg>
