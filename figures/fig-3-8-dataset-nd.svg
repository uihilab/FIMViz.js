<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>FIMViz.js — a forecast with two dimensions, and the Layers it feeds</title>
  <desc>A rainfall forecast holding 48 hourly steps for 7 ensemble members enters through the same
        call as a single image and arrives carrying two axes. Narrowing, collapsing and selecting an
        axis each return another Dataset, which feed a stepped raster Layer, an agreement Layer over
        the members, and a mean raster Layer.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1180" height="500" fill="#ffffff"/>

  <rect x="400" y="26" width="380" height="66" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="590" y="49" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0f172a" text-anchor="middle">addDataset(url)</text>
  <text x="590" y="68" font-size="11" fill="#334155" text-anchor="middle">rainfall_forecast.nc — netcdf</text>
  <text x="590" y="84" font-size="10" fill="#64748b" text-anchor="middle">48 hourly steps × 7 ensemble members</text>

  <rect x="820" y="26" width="320" height="66" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="980" y="49" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">ensemble member</text>
  <text x="980" y="70" font-size="10" fill="#475569" text-anchor="middle">one run of the same forecast, from</text>
  <text x="980" y="84" font-size="10" fill="#475569" text-anchor="middle">a different initial condition</text>

  <line x1="590" y1="94" x2="590" y2="112" stroke="#475569" stroke-width="1.7"/>
  <line x1="155" y1="112" x2="590" y2="112" stroke="#475569" stroke-width="1.7"/>
  <path d="M155,112 V154" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>

  <text x="300" y="136" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a" text-anchor="middle">selectRange(t0, t1)</text>
  <text x="300" y="150" font-size="9.5" fill="#475569" text-anchor="middle">narrows time</text>
  <text x="590" y="136" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a" text-anchor="middle">reduce('mean')</text>
  <text x="590" y="150" font-size="9.5" fill="#475569" text-anchor="middle">over the members</text>
  <text x="880" y="136" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0f172a" text-anchor="middle">select(t)</text>
  <text x="880" y="150" font-size="9.5" fill="#475569" text-anchor="middle">one hour</text>

  <rect x="50" y="158" width="210" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="180" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Dataset</text>
  <text x="155" y="204" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af" text-anchor="middle">time(48) × member(7)</text>
  <text x="155" y="226" font-size="9.5" fill="#334155" text-anchor="middle">the whole forecast</text>

  <rect x="340" y="158" width="210" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="445" y="180" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Dataset</text>
  <text x="445" y="204" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af" text-anchor="middle">time(6) × member(7)</text>
  <text x="445" y="226" font-size="9.5" fill="#334155" text-anchor="middle">a storm window</text>

  <rect x="630" y="158" width="210" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="735" y="180" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Dataset</text>
  <text x="735" y="204" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af" text-anchor="middle">time(6)</text>
  <text x="735" y="226" font-size="9.5" fill="#334155" text-anchor="middle">the member axis is gone</text>

  <rect x="920" y="158" width="210" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1025" y="180" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Dataset</text>
  <text x="1025" y="204" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e40af" text-anchor="middle">no axes</text>
  <text x="1025" y="226" font-size="9.5" fill="#334155" text-anchor="middle">one grid, as in Fig. 3.7</text>

  <line x1="262" y1="201" x2="336" y2="201" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="552" y1="201" x2="626" y2="201" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="842" y1="201" x2="916" y2="201" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>

  <path d="M155,246 V306 H200 V326" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#o)"/>
  <text x="163" y="272" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12">select(t, m)</text>
  <path d="M445,246 V306 H560 V326" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#o)"/>
  <text x="453" y="272" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12">select(t)</text>
  <path d="M1025,246 V306 H920 V326" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#o)"/>
  <text x="1017" y="272" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#7c2d12" text-anchor="end">addLayer()</text>

  <rect x="40" y="330" width="320" height="92" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="200" y="356" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Layer · raster</text>
  <text x="200" y="380" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412" text-anchor="middle">one member, one hour</text>
  <text x="200" y="402" font-size="10" fill="#9a3412" text-anchor="middle">the axis slider steps through time</text>

  <rect x="400" y="330" width="320" height="92" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="560" y="356" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Layer · ensembleAgreement</text>
  <text x="560" y="380" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412" text-anchor="middle">7 members, one hour</text>
  <text x="560" y="402" font-size="10" fill="#9a3412" text-anchor="middle">how many of the 7 are wet, 0 to 7</text>

  <rect x="760" y="330" width="320" height="92" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="920" y="356" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Layer · raster</text>
  <text x="920" y="380" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9a3412" text-anchor="middle">the mean over members</text>
  <text x="920" y="402" font-size="10" fill="#9a3412" text-anchor="middle">one grid, so it renders as Fig. 3.7</text>

  <rect x="1096" y="330" width="34" height="92" rx="8" fill="#ffffff" stroke="#e5a985" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1113" y="384" font-size="16" font-weight="700" fill="#e5a985" text-anchor="middle">…</text>

  <text x="40" y="462" font-size="10.5" fill="#64748b">The axis calls compose in any order and any number of times; two flags on the axis decide which of them it allows — Fig. 3.6.</text>
</svg>
